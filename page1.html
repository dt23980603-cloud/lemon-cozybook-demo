<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스타소울 | 레몬</title>
  <link rel="icon" type="image/png" href="images/branding/lemon-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *,body,button,input,select,textarea{font-family:'Gowun Batang',serif!important;box-sizing:border-box}
    body{margin:20px;background:#f9f9f9;color:#333}
    .page-shell{width:min(1100px,100%);margin:0 auto}
    .page-header{
      display:flex;align-items:center;gap:12px;
      min-height:62px;padding:10px 12px;
      background:#fff;border:1px solid #d9d9d9;border-radius:12px;
    }
    .back-btn{
      width:42px;height:42px;flex:0 0 42px;
      display:flex;align-items:center;justify-content:center;
      border:0;background:transparent;text-decoration:none;
    }
    .back-btn img{display:block;width:100%;height:100%;object-fit:contain}
    .page-title{margin:0;font-size:1.35rem;line-height:1.25}
    .empty-content{min-height:60vh}
    #site-version{
      position:fixed;left:12px;bottom:10px;
      font-size:11px;color:#aaa;z-index:9999;
      pointer-events:none;user-select:none
    }
    @media(max-width:520px){
      body{margin:10px}
      .page-header{min-height:54px;padding:8px 9px}
      .back-btn{width:36px;height:36px;flex-basis:36px}
      .page-title{font-size:1.08rem}
    }
  </style>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#ffe680">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <a href="index.html" class="back-btn" title="메인으로 돌아가기" aria-label="메인으로 돌아가기">
        <img src="images/ui/back-button.png" alt="뒤로가기">
      </a>
      <h1 class="page-title">🌌 스타소울</h1>
    </header>
    <div class="empty-content" aria-hidden="true"></div>
  </main>

  <div id="site-version">demo_v4.4</div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { updateViaCache:'none' })
          .then(registration => registration.update().catch(() => {}))
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
