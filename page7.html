<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>길드원 관리 | 레몬</title>
<link rel="icon" type="image/png" href="images/branding/lemon-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
*,body,input,button,select{font-family:'Gowun Batang',serif;box-sizing:border-box}body{margin:14px;background:#f9f9f9;color:#333}.page{width:min(900px,100%);margin:0 auto}
.header{display:flex;align-items:center;gap:12px;margin-bottom:15px}.back{width:50px;height:50px;display:inline-flex;flex:0 0 auto}.back img{width:100%;height:100%;object-fit:contain}
h1{margin:0;font-size:1.45rem}.subtitle{margin:4px 0 0;color:#777;font-size:.8rem;line-height:1.5}.card{background:#fff;border:1px solid #bbb;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:2px 2px 5px rgba(0,0,0,.04)}
.title{margin:0 0 11px;font-size:1rem}.form{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:8px}.form select,.form input{min-height:42px;padding:8px 10px;border:1px solid #aaa;border-radius:7px;background:#fff}
.btn-add{min-width:90px;border:1px solid #666;border-radius:7px;background:#fff9db;font-weight:700}.status{margin-top:9px;min-height:20px;color:#777;font-size:.76rem}
.member-list{display:flex;flex-direction:column;gap:7px}.member-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 11px;border:1px solid #ddd;border-radius:8px;background:#fafafa}
.member-main{display:flex;align-items:center;gap:9px;min-width:0}.role-dot{width:10px;height:10px;flex:0 0 10px;border-radius:50%}.member-role{min-width:64px;font-weight:700;font-size:.8rem}.member-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role-길드장 .role-dot{background:#b3261e}.role-길드장 .member-role{color:#b3261e}.role-부길드장 .role-dot{background:#c28b00}.role-부길드장 .member-role{color:#9a6700}.role-임원 .role-dot{background:#7b3f98}.role-임원 .member-role{color:#7b3f98}.role-정예 .role-dot{background:#1976a3}.role-정예 .member-role{color:#1976a3}.role-멤버 .role-dot{background:#3f7d3a}.role-멤버 .member-role{color:#3f7d3a}
.actions{display:flex;gap:6px}.actions button{min-height:34px;padding:6px 10px;border:1px solid #999;border-radius:6px;background:#fff;font-size:.74rem;font-weight:700}.actions .delete{color:#9a3030;border-color:#c99}.empty{padding:24px;text-align:center;color:#888;border:1px dashed #ccc;border-radius:8px}
.modal{position:fixed;inset:0;display:none;z-index:1200;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.4)}.modal.show{display:flex}.dialog{width:min(430px,100%);background:#fff;border:2px solid #555;border-radius:10px;padding:17px}
.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.dialog-head h2{margin:0;font-size:1rem}.close{width:34px;height:34px;border:1px solid #aaa;border-radius:50%;background:#fff}.edit-grid{display:grid;gap:9px}.edit-grid label{display:grid;gap:5px;font-size:.78rem;font-weight:700}.edit-grid select,.edit-grid input{min-height:42px;padding:8px 10px;border:1px solid #aaa;border-radius:7px;background:#fff}
.dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.dialog-actions button{min-height:38px;padding:7px 14px;border:1px solid #888;border-radius:7px;background:#fff;font-weight:700}.dialog-actions .save{background:#fff0a8;border-color:#74662a}
#site-version{position:fixed;left:12px;bottom:10px;font-size:11px;color:#aaa;pointer-events:none}
@media(max-width:600px){body{margin:8px}.card{padding:12px}h1{font-size:1.25rem}.form{grid-template-columns:1fr 1fr}.form input{grid-column:1/-1;grid-row:1}.form select{grid-column:1;grid-row:2}.btn-add{grid-column:2;grid-row:2}.member-row{grid-template-columns:1fr}.actions{justify-content:flex-end}}
</style>
</head>
<body>
<main class="page">
<header class="header"><a class="back" href="page5.html"><img src="images/ui/back-button.png" alt="뒤로가기"></a><div><h1>👥 길드원 관리</h1><p class="subtitle">길드원 추가·수정·삭제를 관리합니다. 정보 수정 시 내부 ID는 유지되어 기존 꽃 보유 체크와 꽃 개량 옵션 기록이 유지됩니다.</p></div></header>
<section class="card"><h2 class="title">➕ 길드원 추가</h2><div class="form"><select id="addRole"><option>길드장</option><option>부길드장</option><option>임원</option><option>정예</option><option selected>멤버</option></select><input id="addName" maxlength="40" placeholder="닉네임 입력"><button id="addBtn" class="btn-add">추가</button></div><div id="status" class="status"></div></section>
<section class="card"><h2 class="title">📖 길드원 목록 <span id="memberCount"></span></h2><div id="memberList" class="member-list"></div></section>
</main>
<div id="editModal" class="modal"><div class="dialog"><div class="dialog-head"><h2>✏️ 정보 수정</h2><button id="editClose" class="close">×</button></div><div class="edit-grid"><label>직위<select id="editRole"><option>길드장</option><option>부길드장</option><option>임원</option><option>정예</option><option>멤버</option></select></label><label>닉네임<input id="editName" maxlength="40"></label></div><div class="dialog-actions"><button id="editCancel">취소</button><button id="editSave" class="save">저장</button></div></div></div>
<div id="site-version">demo_v33</div>
<script>
const API='/api/guild-state';const roleOrder={'길드장':1,'부길드장':2,'임원':3,'정예':4,'멤버':5};let members=[],checks={},flowerOptions={},editMemberId='';
const memberList=document.getElementById('memberList'),memberCount=document.getElementById('memberCount'),statusEl=document.getElementById('status'),addRole=document.getElementById('addRole'),addName=document.getElementById('addName'),editModal=document.getElementById('editModal'),editRole=document.getElementById('editRole'),editName=document.getElementById('editName');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function sorted(){return [...members].sort((a,b)=>(roleOrder[a.role]||99)-(roleOrder[b.role]||99)||String(a.name||'').localeCompare(String(b.name||''),'ko-KR'))}
function render(){const list=sorted();memberCount.textContent=`(${list.length}명)`;memberList.innerHTML=list.length?list.map(m=>`<div class="member-row role-${esc(m.role||'멤버')}"><div class="member-main"><span class="role-dot"></span><span class="member-role">${esc(m.role||'멤버')}</span><span class="member-name">${esc(m.name||'')}</span></div><div class="actions"><button data-edit="${esc(m.id)}">✏️ 정보 수정</button><button class="delete" data-delete="${esc(m.id)}">삭제</button></div></div>`).join(''):'<div class="empty">등록된 길드원이 없습니다.</div>';memberList.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));memberList.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteMember(b.dataset.delete))}
function localSave(){localStorage.setItem('guild_members',JSON.stringify(members));localStorage.setItem('guild_checks',JSON.stringify(checks));localStorage.setItem('guild_flower_options',JSON.stringify(flowerOptions))}
async function load(){try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw new Error(`GET ${r.status}`);const p=await r.json();if(p.exists&&p.state){members=Array.isArray(p.state.members)?p.state.members:[];checks=p.state.checks&&typeof p.state.checks==='object'?p.state.checks:{};flowerOptions=p.state.flowerOptions&&typeof p.state.flowerOptions==='object'?p.state.flowerOptions:{}}else{members=JSON.parse(localStorage.getItem('guild_members')||'[]');checks=JSON.parse(localStorage.getItem('guild_checks')||'{}');flowerOptions=JSON.parse(localStorage.getItem('guild_flower_options')||'{}')}localSave();render()}catch(e){console.warn(e);statusEl.textContent='길드원 정보를 불러오지 못했습니다.'}}
async function savePatch(state){const r=await fetch(API,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({state})});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||`PUT ${r.status}`)}
function duplicate(name,except=''){const n=String(name).trim().toLocaleLowerCase('ko-KR');return members.some(m=>m.id!==except&&String(m.name||'').trim().toLocaleLowerCase('ko-KR')===n)}
async function addMember(){const name=addName.value.trim(),role=addRole.value;if(!name)return alert('닉네임을 입력해주세요.');if(duplicate(name))return alert('이미 사용 중인 닉네임입니다.');members.push({id:`m_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,role,name});localSave();render();addName.value='';statusEl.textContent='저장 중…';try{await savePatch({members});statusEl.textContent=`${name}님을 추가했습니다.`}catch(e){console.warn(e);statusEl.textContent='저장 실패. 다시 불러옵니다.';await load()}}
function openEdit(id){const m=members.find(x=>x.id===id);if(!m)return;editMemberId=id;editRole.value=m.role||'멤버';editName.value=m.name||'';editModal.classList.add('show');editName.focus()}
function closeEdit(){editModal.classList.remove('show');editMemberId=''}
async function saveEdit(){const m=members.find(x=>x.id===editMemberId);if(!m)return closeEdit();const name=editName.value.trim(),role=editRole.value;if(!name)return alert('닉네임을 입력해주세요.');if(duplicate(name,m.id))return alert('이미 사용 중인 닉네임입니다.');if(name===m.name&&role===m.role)return alert('변경된 정보가 없습니다.');m.name=name;m.role=role;localSave();render();closeEdit();statusEl.textContent='저장 중…';try{await savePatch({members});statusEl.textContent=`${name}님의 정보를 수정했습니다.`}catch(e){console.warn(e);statusEl.textContent='저장 실패. 다시 불러옵니다.';await load()}}
function belongs(key,id){return String(key||'').endsWith(`::${id}`)||String(key||'').endsWith(`_${id}`)}
async function deleteMember(id){const m=members.find(x=>x.id===id);if(!m)return;if(!confirm(`${m.name}님을 삭제하시겠습니까?\n해당 길드원의 꽃 보유 체크와 꽃 개량 옵션 기록도 함께 삭제됩니다.`))return;members=members.filter(x=>x.id!==id);Object.keys(checks).forEach(k=>{if(belongs(k,id))delete checks[k]});Object.keys(flowerOptions).forEach(k=>{if(belongs(k,id))delete flowerOptions[k]});localSave();render();statusEl.textContent='삭제 내용을 저장 중…';try{await savePatch({members,checks,flowerOptions});statusEl.textContent=`${m.name}님을 삭제했습니다.`}catch(e){console.warn(e);statusEl.textContent='저장 실패. 다시 불러옵니다.';await load()}}
document.getElementById('addBtn').onclick=addMember;addName.onkeydown=e=>{if(e.key==='Enter')addMember()};document.getElementById('editClose').onclick=closeEdit;document.getElementById('editCancel').onclick=closeEdit;document.getElementById('editSave').onclick=saveEdit;editModal.onclick=e=>{if(e.target===editModal)closeEdit()};document.onkeydown=e=>{if(e.key==='Escape'&&editModal.classList.contains('show'))closeEdit()};load();window.addEventListener('focus',load);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script>
<script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}</script>
</body></html>
