<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>demo 길드원 계정 관리</title><link rel="icon" href="/images/branding/lemon-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth.css"><link rel="manifest" href="/manifest.webmanifest?v=4.39">
</head><body><main class="admin-page">
  <header class="admin-head"><div><h1>🔐 길드원 계정 관리</h1><div class="account-meta">로그인 코드와 PIN 발급 · demo_v4.39</div></div><div class="admin-head-actions"><a class="auth-secondary" href="/page7.html" style="text-decoration:none">길드원 관리</a><a class="auth-secondary" href="/index.html" style="text-decoration:none">메인</a></div></header>
  <section class="admin-panel"><h2>새 테스트 계정 발급</h2><div class="account-create-grid">
    <label class="auth-field">길드원<select id="memberSelect"><option value="">길드원을 불러오는 중...</option></select></label>
    <label class="auth-field">권한<select id="roleSelect"><option value="member">일반 길드원</option><option value="admin">관리자</option></select></label>
    <button class="auth-primary" id="createAccount" type="button">코드·임시 PIN 발급</button>
  </div><div class="credential-box" id="credentialBox" hidden><strong>이 정보는 지금 복사해서 해당 길드원에게 전달해주세요.</strong><div class="credential-row"><span>로그인 코드</span><span class="credential-value" id="credentialCode"></span></div><div class="credential-row"><span>임시 PIN</span><span class="credential-value" id="credentialPin"></span></div><button class="auth-secondary" id="copyCredential" type="button">전체 복사</button></div><div class="auth-status" id="createStatus"></div></section>
  <section class="admin-panel"><h2>발급된 계정 <span id="accountCount"></span></h2><div class="account-list" id="accountList"><div class="account-empty">계정 목록을 불러오는 중입니다.</div></div></section>
</main><script src="/auth-client.js" defer></script><script>
const memberSelect=document.getElementById('memberSelect'),accountList=document.getElementById('accountList'),credentialBox=document.getElementById('credentialBox');let accounts=[];
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
const formatDate=value=>value?new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(value)):'없음';
async function load(){try{const r=await fetch('/api/auth/accounts',{cache:'no-store'});const p=await r.json();if(!r.ok)throw new Error(p.error||'계정 목록을 불러오지 못했습니다.');accounts=p.accounts||[];memberSelect.innerHTML='<option value="">길드원 선택</option>'+(p.availableMembers||[]).map(m=>`<option value="${esc(m.id)}">${esc(m.role||'멤버')} · ${esc(m.name)}</option>`).join('');render()}catch(error){accountList.innerHTML=`<div class="account-empty">${esc(error.message)}</div>`}}
function render(){document.getElementById('accountCount').textContent=`(${accounts.length}명)`;accountList.innerHTML=accounts.length?accounts.map(a=>`<article class="account-card" data-account-id="${esc(a.accountId)}"><div><div class="account-name">${esc(a.memberName)} <small>· ${esc(a.memberRole||'멤버')}</small></div><div class="account-badges"><span class="account-badge ${a.role==='admin'?'admin':''}">${a.role==='admin'?'관리자':'일반 길드원'}</span><span class="account-badge ${a.status!=='active'?'inactive':''}">${a.status==='active'?'사용 가능':'비활성화'}</span><span class="account-badge">로그인 기기 ${a.sessionCount||0}</span>${a.mustChangePin?'<span class="account-badge">PIN 변경 대기</span>':''}</div><div class="account-last">최근 로그인 ${formatDate(a.lastLoginAt)}</div></div><div><div class="account-code">${esc(a.loginCode)}</div><div class="account-meta">계정 생성 ${formatDate(a.createdAt)}</div></div><div class="account-actions"><button data-action="copy">코드 복사</button><button data-action="resetPin">PIN 초기화</button><button data-action="regenerateCode">코드 재발급</button><button data-action="revokeSessions">기기 로그아웃</button><button data-action="setRole">${a.role==='admin'?'일반 권한':'관리자 권한'}</button><button class="danger" data-action="setStatus">${a.status==='active'?'비활성화':'활성화'}</button></div></article>`).join(''):'<div class="account-empty">발급된 계정이 없습니다.</div>'}
function showCredential(code,pin,name=''){document.getElementById('credentialCode').textContent=code;document.getElementById('credentialPin').textContent=pin;credentialBox.dataset.name=name;credentialBox.hidden=false;credentialBox.scrollIntoView({behavior:'smooth',block:'nearest'})}
document.getElementById('createAccount').addEventListener('click',async()=>{const memberId=memberSelect.value;if(!memberId)return alert('길드원을 선택해주세요.');const button=document.getElementById('createAccount');button.disabled=true;try{const r=await fetch('/api/auth/accounts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({memberId,role:document.getElementById('roleSelect').value})});const p=await r.json();if(!r.ok)throw new Error(p.error||'계정을 만들지 못했습니다.');showCredential(p.account.loginCode,p.temporaryPin,p.account.memberName);await load()}catch(error){document.getElementById('createStatus').textContent=error.message}finally{button.disabled=false}});
accountList.addEventListener('click',async event=>{const button=event.target.closest('button[data-action]');if(!button)return;const card=button.closest('[data-account-id]'),account=accounts.find(a=>a.accountId===card.dataset.accountId);if(!account)return;const action=button.dataset.action;if(action==='copy'){await navigator.clipboard.writeText(account.loginCode);button.textContent='복사됨';return}
  const messages={resetPin:'새 임시 PIN을 발급하고 기존 로그인 기기를 모두 로그아웃할까요?',regenerateCode:'로그인 코드를 재발급하고 기존 로그인 기기를 모두 로그아웃할까요?',revokeSessions:'이 계정의 다른 로그인 기기를 모두 로그아웃할까요?',setRole:`${account.role==='admin'?'일반 길드원':'관리자'} 권한으로 변경할까요?`,setStatus:`계정을 ${account.status==='active'?'비활성화':'활성화'}할까요?`};if(!confirm(messages[action]||'변경할까요?'))return;
  const body={action};if(action==='setRole')body.role=account.role==='admin'?'member':'admin';if(action==='setStatus')body.status=account.status==='active'?'inactive':'active';button.disabled=true;try{const r=await fetch(`/api/auth/accounts/${encodeURIComponent(account.accountId)}`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const p=await r.json();if(!r.ok)throw new Error(p.error||'계정을 변경하지 못했습니다.');if(p.temporaryPin)showCredential(p.account.loginCode,p.temporaryPin,p.account.memberName);else if(action==='regenerateCode')showCredential(p.loginCode,'기존 PIN 유지',p.account.memberName);await load()}catch(error){alert(error.message)}finally{button.disabled=false}
});
document.getElementById('copyCredential').addEventListener('click',async()=>{const text=`${credentialBox.dataset.name||'길드원'} 레몬공책 로그인\n로그인 코드: ${document.getElementById('credentialCode').textContent}\n임시 PIN: ${document.getElementById('credentialPin').textContent}`;await navigator.clipboard.writeText(text);document.getElementById('copyCredential').textContent='복사 완료'});
load();
</script></body></html>
