<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>demo 길드원 · 계정 관리</title><link rel="icon" href="/images/branding/lemon-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth.css"><link rel="manifest" href="/manifest.webmanifest?v=4.42">
</head><body><main class="admin-page">
  <header class="admin-head"><div><h1>🔐 길드원 · 계정 관리</h1><div class="account-meta">길드원 정보와 로그인 계정을 한곳에서 관리 · demo_v4.42</div></div><div class="admin-head-actions"><a class="auth-secondary" href="/index.html" style="text-decoration:none">메인</a></div></header>
  <section class="admin-panel"><h2>길드원 등록 · 계정 발급</h2><p class="admin-help">기존 길드원에게 계정만 발급하거나, 새 길드원의 닉네임·직위·사이트 권한을 한 번에 등록할 수 있습니다.</p><div class="account-create-grid unified-create-grid">
    <label class="auth-field">대상 길드원<select id="memberSelect"><option value="">길드원을 불러오는 중...</option></select></label>
    <label class="auth-field new-member-field" id="newMemberField" hidden>새 길드원 닉네임<input id="memberName" maxlength="40" placeholder="닉네임 입력"></label>
    <label class="auth-field">길드 직위<select id="memberRole"><option>길드장</option><option>부길드장</option><option>임원</option><option>정예</option><option selected>멤버</option></select></label>
    <label class="auth-field">사이트 권한<select id="accessRole"><option value="member">일반 길드원</option><option value="admin">관리자</option></select></label>
    <button class="auth-primary" id="createAccount" type="button">등록 · 코드 발급</button>
  </div><div class="credential-box" id="credentialBox" hidden><strong>이 정보는 지금 복사해서 해당 길드원에게 전달해주세요.</strong><div class="credential-row"><span>로그인 코드</span><span class="credential-value" id="credentialCode"></span></div><div class="credential-row"><span>임시 PIN</span><span class="credential-value" id="credentialPin"></span></div><button class="auth-secondary" id="copyCredential" type="button">전체 복사</button></div><div class="auth-status" id="createStatus"></div></section>
  <section class="admin-panel"><h2>전체 길드원 <span id="memberCount"></span></h2><div class="account-list" id="accountList"><div class="account-empty">길드원 정보를 불러오는 중입니다.</div></div></section>
</main>
<div class="account-modal" id="editModal" hidden><div class="account-dialog"><div class="account-dialog-head"><h2>✏️ 길드원 정보 수정</h2><button type="button" id="editClose" aria-label="닫기">×</button></div><label class="auth-field">닉네임<input id="editMemberName" maxlength="40"></label><label class="auth-field">길드 직위<select id="editMemberRole"><option>길드장</option><option>부길드장</option><option>임원</option><option>정예</option><option>멤버</option></select></label><div class="account-dialog-actions"><button class="auth-secondary" id="editCancel" type="button">취소</button><button class="auth-primary" id="editSave" type="button">저장</button></div></div></div>
<script src="/auth-client.js" defer></script><script>
const memberSelect=document.getElementById('memberSelect'),memberRole=document.getElementById('memberRole'),memberName=document.getElementById('memberName'),newMemberField=document.getElementById('newMemberField'),accountList=document.getElementById('accountList'),credentialBox=document.getElementById('credentialBox'),createStatus=document.getElementById('createStatus'),editModal=document.getElementById('editModal');
const roleOrder={'길드장':1,'부길드장':2,'임원':3,'정예':4,'멤버':5};let accounts=[],members=[],availableMembers=[],currentAccountId='',editingMemberId='';
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
const formatDate=value=>value?new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(value)):'없음';
const readPayload=async response=>{const text=await response.text();try{return text?JSON.parse(text):{}}catch(_){throw new Error(response.status>=500?'서버 처리 중 오류가 발생했습니다.':'서버 응답을 확인하지 못했습니다.')}};
function sortedMembers(){return [...members].sort((a,b)=>(roleOrder[a.role]||99)-(roleOrder[b.role]||99)||String(a.name||'').localeCompare(String(b.name||''),'ko-KR'))}
function accountFor(memberId){return accounts.find(account=>account.memberId===memberId)||null}
function renderSelector(selected=''){
  memberSelect.innerHTML='<option value="">대상 선택</option><option value="__new__">➕ 새 길드원 등록</option>'+availableMembers.map(member=>`<option value="${esc(member.id)}">${esc(member.role||'멤버')} · ${esc(member.name)}</option>`).join('');
  if(selected&&[...memberSelect.options].some(option=>option.value===selected))memberSelect.value=selected;syncCreateForm();
}
function syncCreateForm(){const isNew=memberSelect.value==='__new__';newMemberField.hidden=!isNew;if(isNew)memberRole.value='멤버';else{const member=availableMembers.find(item=>item.id===memberSelect.value);if(member)memberRole.value=member.role||'멤버'}document.getElementById('createAccount').textContent=isNew?'길드원 등록 · 코드 발급':memberSelect.value?'코드 · 임시 PIN 발급':'등록 · 코드 발급'}
async function load(selected=''){try{const r=await fetch('/api/auth/accounts',{cache:'no-store'});const p=await readPayload(r);if(!r.ok)throw new Error(p.error||'길드원 정보를 불러오지 못했습니다.');accounts=p.accounts||[];members=p.members||[];availableMembers=p.availableMembers||[];currentAccountId=p.currentAccountId||'';renderSelector(selected);render()}catch(error){accountList.innerHTML=`<div class="account-empty">${esc(error.message)}</div>`}}
function render(){const list=sortedMembers();document.getElementById('memberCount').textContent=`(${list.length}명 · 계정 ${accounts.length}명)`;accountList.innerHTML=list.length?list.map(member=>{const account=accountFor(member.id),isCurrent=account?.accountId===currentAccountId;return `<article class="account-card" data-member-id="${esc(member.id)}" data-account-id="${esc(account?.accountId||'')}"><div><div class="account-name">${esc(member.name)} <small>· ${esc(member.role||'멤버')}</small></div><div class="account-badges">${account?`<span class="account-badge ${account.role==='admin'?'admin':''}">${account.role==='admin'?'관리자':'일반 길드원'}</span><span class="account-badge ${account.status!=='active'?'inactive':''}">${account.status==='active'?'사용 가능':'비활성화'}</span><span class="account-badge">로그인 기기 ${account.sessionCount||0}</span>${account.mustChangePin?'<span class="account-badge">PIN 변경 대기</span>':''}${isCurrent?'<span class="account-badge current">현재 계정</span>':''}`:'<span class="account-badge unissued">계정 미발급</span>'}</div><div class="account-last">${account?`최근 로그인 ${formatDate(account.lastLoginAt)}`:'길드원 정보만 등록되어 있습니다.'}</div></div><div>${account?`<div class="account-code">${esc(account.loginCode)}</div><div class="account-meta">계정 생성 ${formatDate(account.createdAt)}</div>`:'<div class="account-code muted">로그인 계정 없음</div>'}</div><div class="account-actions"><button data-action="editMember">정보 수정</button>${account?`<button data-action="copy">코드 복사</button><button data-action="resetPin">PIN 초기화</button><button data-action="regenerateCode">코드 재발급</button><button data-action="revokeSessions">기기 로그아웃</button>${isCurrent?'':`<button data-action="setRole">${account.role==='admin'?'일반 권한':'관리자 권한'}</button><button class="danger" data-action="setStatus">${account.status==='active'?'비활성화':'활성화'}</button>`}`:`<button class="issue" data-action="issueAccount">계정 발급</button>`}${isCurrent?'':`<button class="danger solid" data-action="deleteMember">전체 삭제</button>`}</div></article>`}).join(''):'<div class="account-empty">등록된 길드원이 없습니다.</div>'}
function showCredential(code,pin,name=''){document.getElementById('credentialCode').textContent=code;document.getElementById('credentialPin').textContent=pin;credentialBox.dataset.name=name;credentialBox.hidden=false;credentialBox.scrollIntoView({behavior:'smooth',block:'nearest'})}
memberSelect.addEventListener('change',syncCreateForm);
document.getElementById('createAccount').addEventListener('click',async()=>{const isNew=memberSelect.value==='__new__';if(!memberSelect.value)return alert('기존 길드원 또는 새 길드원 등록을 선택해주세요.');if(isNew&&!memberName.value.trim())return alert('새 길드원 닉네임을 입력해주세요.');const button=document.getElementById('createAccount');button.disabled=true;createStatus.className='auth-status';createStatus.textContent='길드원과 로그인 계정을 저장하는 중...';const body={createNewMember:isNew,memberId:isNew?'':memberSelect.value,memberName:isNew?memberName.value:'',memberRole:memberRole.value,role:document.getElementById('accessRole').value};try{const r=await fetch('/api/auth/accounts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const p=await readPayload(r);if(!r.ok)throw new Error(p.error||'계정을 만들지 못했습니다.');showCredential(p.account.loginCode,p.temporaryPin,p.account.memberName);memberName.value='';createStatus.className='auth-status success';createStatus.textContent=`${p.account.memberName}님의 계정을 발급했습니다.`;await load()}catch(error){createStatus.className='auth-status error';createStatus.textContent=error.message}finally{button.disabled=false}});
function openEdit(member){editingMemberId=member.id;document.getElementById('editMemberName').value=member.name||'';document.getElementById('editMemberRole').value=member.role||'멤버';editModal.hidden=false;document.getElementById('editMemberName').focus()}
function closeEdit(){editingMemberId='';editModal.hidden=true}
document.getElementById('editClose').onclick=closeEdit;document.getElementById('editCancel').onclick=closeEdit;editModal.addEventListener('click',event=>{if(event.target===editModal)closeEdit()});
document.getElementById('editSave').addEventListener('click',async()=>{const member=members.find(item=>item.id===editingMemberId);if(!member)return closeEdit();const memberName=document.getElementById('editMemberName').value.trim(),memberRole=document.getElementById('editMemberRole').value;if(!memberName)return alert('닉네임을 입력해주세요.');const button=document.getElementById('editSave');button.disabled=true;try{const r=await fetch(`/api/auth/members/${encodeURIComponent(member.id)}`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({memberName,memberRole})});const p=await readPayload(r);if(!r.ok)throw new Error(p.error||'길드원 정보를 수정하지 못했습니다.');closeEdit();await load()}catch(error){alert(error.message)}finally{button.disabled=false}});
accountList.addEventListener('click',async event=>{const button=event.target.closest('button[data-action]');if(!button)return;const card=button.closest('[data-member-id]'),member=members.find(item=>item.id===card.dataset.memberId),account=accounts.find(item=>item.accountId===card.dataset.accountId);if(!member)return;const action=button.dataset.action;if(action==='editMember')return openEdit(member);if(action==='issueAccount'){renderSelector(member.id);document.querySelector('.admin-panel').scrollIntoView({behavior:'smooth',block:'start'});return}if(action==='copy'&&account){await navigator.clipboard.writeText(account.loginCode);button.textContent='복사됨';return}if(action==='deleteMember'){if(!confirm(`${member.name}님의 로그인 계정과 길드원 정보를 모두 삭제하시겠습니까?\n꽃 보유 체크, 개량 옵션, 생일 정보도 함께 삭제됩니다.`))return;if(!confirm('삭제된 정보는 복구할 수 없습니다. 정말 전체 삭제할까요?'))return;button.disabled=true;try{const r=await fetch(`/api/auth/members/${encodeURIComponent(member.id)}`,{method:'DELETE'});const p=await readPayload(r);if(!r.ok)throw new Error(p.error||'길드원을 삭제하지 못했습니다.');await load()}catch(error){alert(error.message)}finally{button.disabled=false}return}if(!account)return;
  const messages={resetPin:'새 임시 PIN을 발급하고 기존 로그인 기기를 모두 로그아웃할까요?',regenerateCode:'로그인 코드를 재발급하고 기존 로그인 기기를 모두 로그아웃할까요?',revokeSessions:'이 계정의 다른 로그인 기기를 모두 로그아웃할까요?',setRole:`${account.role==='admin'?'일반 길드원':'관리자'} 권한으로 변경할까요?`,setStatus:`계정을 ${account.status==='active'?'비활성화':'활성화'}할까요?`};if(!confirm(messages[action]||'변경할까요?'))return;const body={action};if(action==='setRole')body.role=account.role==='admin'?'member':'admin';if(action==='setStatus')body.status=account.status==='active'?'inactive':'active';button.disabled=true;try{const r=await fetch(`/api/auth/accounts/${encodeURIComponent(account.accountId)}`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const p=await readPayload(r);if(!r.ok)throw new Error(p.error||'계정을 변경하지 못했습니다.');if(p.temporaryPin)showCredential(p.account.loginCode,p.temporaryPin,p.account.memberName);else if(action==='regenerateCode')showCredential(p.loginCode,'기존 PIN 유지',p.account.memberName);await load()}catch(error){alert(error.message)}finally{button.disabled=false}
});
document.getElementById('copyCredential').addEventListener('click',async()=>{const text=`${credentialBox.dataset.name||'길드원'} 레몬공책 로그인\n로그인 코드: ${document.getElementById('credentialCode').textContent}\n임시 PIN: ${document.getElementById('credentialPin').textContent}`;await navigator.clipboard.writeText(text);document.getElementById('copyCredential').textContent='복사 완료'});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!editModal.hidden)closeEdit()});load();
</script></body></html>
