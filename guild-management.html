  <style>
    :root{--neutral:#e8eaed;--missed:#ffcfc9;--achieved:#d4edbc;--high:#bfe1f6;--officer:#e8d9f6;--line:#dfd7ba;--ink:#4d4738;--soft:#fffdf4}
    *{box-sizing:border-box}body{padding-bottom:78px;color:var(--ink)}button,input,select,textarea{font:inherit}.management-page{width:min(1380px,100%);margin:0 auto}
    .management-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}.management-head h1{margin:0;font-size:1.5rem}.management-head p{margin:4px 0 0;color:#7c7462;font-size:.75rem}
    .management-panel{margin-bottom:14px;padding:17px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.96);box-shadow:0 9px 24px rgba(92,77,24,.09)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.panel-head h2{margin:0;font-size:1rem}.panel-note{color:#8a8374;font-size:.68rem;text-align:right}
    .filter-grid{display:grid;grid-template-columns:190px minmax(220px,1fr) auto;gap:9px;align-items:end}.filter-grid .auth-field{margin:0}.filter-grid button{min-width:92px}.date-toolbar{display:flex;justify-content:flex-end;margin-bottom:10px}.date-field{width:250px;margin:0}
    .legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 13px}.legend span,.status-pill{display:inline-flex;align-items:center;justify-content:center;min-height:25px;padding:3px 8px;border-radius:999px;font-size:.65rem;white-space:nowrap}.tone-neutral{background:var(--neutral)}.tone-missed{background:var(--missed);color:#963c36}.tone-achieved{background:var(--achieved);color:#426735}.tone-high{background:var(--high);color:#315f7e}.tone-officer{background:var(--officer);color:#664e85}
    .table-scroll{width:100%;overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fff;-webkit-overflow-scrolling:touch}.data-table{width:100%;min-width:1130px;border-collapse:separate;border-spacing:0;font-size:.7rem;table-layout:fixed}.data-table th,.data-table td{padding:7px;border-right:1px solid #e7e0c8;border-bottom:1px solid #e7e0c8;text-align:center;vertical-align:middle}.data-table th:last-child,.data-table td:last-child{border-right:0}.data-table tbody tr:last-child td{border-bottom:0}.data-table thead th{background:#fff9dc;color:#5c543c;font-weight:700}.data-table thead tr:first-child th{position:sticky;top:0;z-index:5}.data-table thead tr:nth-child(2) th{position:sticky;top:35px;z-index:5;background:#fffdf3}.group-build{box-shadow:inset 0 4px 0 #9dc777}.group-competition{box-shadow:inset 0 4px 0 #efad85}.group-attendance{box-shadow:inset 0 4px 0 #9bbfdc}
    .entry-table{min-width:1060px}.entry-table .col-no{width:46px}.entry-table .col-member{width:112px}.entry-table .col-build{width:132px}.entry-table .col-count{width:82px}.entry-table .col-competition{width:126px}.entry-table .col-number{width:90px}.entry-table .col-absent{width:92px}.entry-table .col-memo{width:205px}.stats-table{min-width:1290px}.stats-table .col-range{width:188px}.stats-table .col-build{width:245px}.stats-table .col-count{width:82px}.stats-table .col-competition{width:136px}.stats-table .col-number{width:90px}.stats-table .col-memo{width:210px}
    .sequence{font-weight:700;color:#8c7b38}.member-cell{text-align:center!important}.member-name{display:block;font-size:.76rem;font-weight:700;color:#413b2f}.member-role{display:block;margin-top:2px;color:#827a68;font-size:.62rem}.member-joined{display:block;margin-top:2px;color:#9a927e;font-size:.59rem}.range-cell{font-weight:700;background:#fffdf6;white-space:nowrap}
    .cell-control{width:100%;min-height:38px;padding:7px 6px;border:1px solid #d9d1b7;border-radius:9px;background:#fff;color:#443f33;outline:none}.cell-control:focus{border-color:#8a7a2b;box-shadow:0 0 0 3px rgba(255,230,128,.3)}select.cell-control{text-align:center;text-align-last:center}textarea.cell-control{min-height:38px;resize:vertical;line-height:1.35}.build-select[data-value=""]{background:var(--neutral)}.build-select[data-value="missed"],.competition-select[data-value="missed"]{background:var(--missed)}.build-select[data-value="achieved_under70"],.competition-select[data-value="achieved"]{background:var(--achieved)}.build-select[data-value="achieved_70plus"]{background:var(--high)}.competition-select[data-value="missed_officer"]{background:var(--officer)}
    .absence-toggle{display:flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:5px;border:1px solid #d9d1b7;border-radius:9px;background:#fff;cursor:pointer}.absence-toggle.checked{background:var(--missed);color:#8d3e38}.absence-toggle input{width:17px;height:17px;accent-color:#bf6259}.status-text{display:inline-flex;align-items:center;justify-content:center;min-height:26px;padding:4px 8px;border-radius:8px;line-height:1.25}.memo-view{max-width:210px;text-align:left!important;white-space:pre-wrap;overflow-wrap:anywhere;color:#746d5e}.empty-state{padding:25px;text-align:center;color:#8c8576;font-size:.76rem;border:1px dashed #d9cfaa;border-radius:13px;background:#fffdf4}.stats-placeholder{display:grid;place-items:center;min-height:118px;padding:24px;color:#8a8374;font-size:.75rem;text-align:center;border:1px dashed #d9cfaa;border-radius:13px;background:#fffdf4}
    .ratio-wrap{display:grid;gap:5px}.ratio-bar{display:flex;width:100%;height:24px;overflow:hidden;border:1px solid #d9dce0;border-radius:8px;background:var(--neutral)}.ratio-segment{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;font-size:.58rem;font-weight:700;white-space:nowrap}.ratio-segment.under{background:var(--achieved);color:#426735}.ratio-segment.high{background:var(--high);color:#315f7e}.ratio-segment.missed{background:var(--missed);color:#963c36}.ratio-caption{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;color:#776f60;font-size:.56rem}.ratio-caption span{display:inline-flex;align-items:center;gap:3px}.ratio-dot{width:7px;height:7px;border-radius:50%}.ratio-dot.under{background:var(--achieved)}.ratio-dot.high{background:var(--high)}.ratio-dot.missed{background:var(--missed)}
    .save-toast{position:fixed;left:50%;bottom:18px;z-index:10030;transform:translateX(-50%);min-width:150px;padding:8px 13px;border:1px solid #d7ca8c;border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 6px 20px rgba(60,50,20,.14);color:#655b30;text-align:center;font-size:.7rem;opacity:0;pointer-events:none;transition:.2s}.save-toast.show{opacity:1}.save-toast.error{border-color:#dfa7a0;color:#9a3e38;background:#fff7f6}
    @media(max-width:800px){body{padding:15px 10px 70px}.management-head h1{font-size:1.18rem}.management-head p{font-size:.66rem}.management-panel{padding:13px;border-radius:16px}.panel-head{align-items:flex-start}.panel-note{max-width:49%;font-size:.61rem}.filter-grid{grid-template-columns:1fr 1.35fr}.filter-grid button{grid-column:1/-1;width:100%}.date-toolbar{justify-content:stretch}.date-field{width:100%}.data-table{font-size:.68rem}.entry-table .col-no{width:42px}.entry-table .col-member{width:108px}.data-table .sticky-one,.data-table .sticky-two{left:auto}.cell-control{min-height:41px;font-size:.7rem}.management-panel.input-panel{padding-left:10px;padding-right:10px}}
    @media(max-width:430px){.filter-grid{grid-template-columns:1fr}.filter-grid button{grid-column:auto}.management-head p{max-width:250px}.panel-head{display:grid}.panel-note{max-width:none;text-align:left}.legend{margin-bottom:10px}}
  </style>
</head>
<body>
  <main class="management-page">
    <header class="management-head"><div><h1>📋 길드원 관리</h1><p>길드 건설 · 길드 경쟁전 · 접속 기록을 관리합니다. · demo_v4.54</p></div><a class="auth-secondary admin-home-link" href="/index.html" title="메인페이지로 이동" aria-label="메인페이지로 이동">🏠</a></header>
    <section class="management-panel"><div class="panel-head"><h2>조회 설정</h2><span class="panel-note">한국 시간 기준으로 저장됩니다.</span></div><div class="filter-grid"><label class="auth-field">조회 월<input id="monthPicker" type="month"></label><label class="auth-field">길드원 검색<input id="memberSearch" type="search" list="memberSuggestions" placeholder="닉네임을 검색해주세요"></label><datalist id="memberSuggestions"></datalist><button class="auth-secondary" id="refreshButton" type="button">새로고침</button></div></section>
    <section class="management-panel" id="statsPanel" hidden><div class="panel-head"><h2 id="statsTitle">월간 통계</h2><span class="panel-note">월요일~일요일 단위로 기록을 표시합니다.</span></div><div id="statsContent"><div class="stats-placeholder">길드원을 검색하면 월간 통계가 표시됩니다.</div></div></section>
    <section class="management-panel input-panel"><div class="panel-head"><h2 id="entryTitle">주간 기록 입력</h2><span class="panel-note">선택한 날짜가 포함된 월요일~일요일 기록입니다.</span></div><div class="date-toolbar"><label class="auth-field date-field">기록 날짜<input id="recordDate" type="date"></label></div><div class="legend" aria-label="상태 색상 안내"><span class="tone-neutral">-</span><span class="tone-missed">미달성</span><span class="tone-achieved">달성(70점-)</span><span class="tone-high">달성(70점↑)</span><span class="tone-officer">미달성(임원)</span></div><div id="entryContent"><div class="empty-state">기록을 불러오는 중입니다.</div></div></section>
  </main>
  <div class="save-toast" id="saveToast" role="status" aria-live="polite"></div>
  <script src="/auth-client.js" defer></script>
  <script>
  (()=>{
    const roleOrder={'길드장':1,'부길드장':2,'임원':3,'정예':4,'멤버':5};
    const BUILD_LABELS={'':'-','missed':'미달성','achieved_under70':'달성(70점-)','achieved_70plus':'달성(70점↑)'};
    const COMP_LABELS={missed:'미달성',achieved:'달성',missed_officer:'미달성(임원)'};
    const DAY_NAMES=['일','월','화','수','목','금','토'];
    const monthPicker=document.getElementById('monthPicker'),recordDate=document.getElementById('recordDate'),memberSearch=document.getElementById('memberSearch');
    const statsPanel=document.getElementById('statsPanel'),statsContent=document.getElementById('statsContent'),entryContent=document.getElementById('entryContent'),saveToast=document.getElementById('saveToast');
    let members=[],daily=[],weekly=[],lastToday='',pendingSaves=0,toastTimer=0;
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const number=value=>Math.max(0,Number(value)||0),fmt=value=>new Intl.NumberFormat('ko-KR').format(number(value));
    function kstDate(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const values=Object.fromEntries(parts.map(part=>[part.type,part.value]));return `${values.year}-${values.month}-${values.day}`}
    function parseDate(value){const parts=String(value||'').split('-').map(Number);return parts.length===3?new Date(Date.UTC(parts[0],parts[1]-1,parts[2])):null}
    function isoDate(date){return date.toISOString().slice(0,10)}
    function addDays(value,days){const date=typeof value==='string'?parseDate(value):new Date(value.getTime());date.setUTCDate(date.getUTCDate()+days);return isoDate(date)}
    function mondayForDate(value){const date=parseDate(value),offset=(date.getUTCDay()+6)%7;date.setUTCDate(date.getUTCDate()-offset);return isoDate(date)}
    function monthWeeks(month){const first=`${month}-01`,parts=month.split('-').map(Number),last=isoDate(new Date(Date.UTC(parts[0],parts[1],0))),lastStart=mondayForDate(last),weeks=[];for(let start=mondayForDate(first);start<=lastStart;start=addDays(start,7))weeks.push(start);return weeks}
    function rangeLabel(start,includeYear=false){const end=addDays(start,6),a=parseDate(start),b=parseDate(end);const startText=`${includeYear?`${a.getUTCFullYear()}년 `:''}${a.getUTCMonth()+1}월 ${a.getUTCDate()}일(${DAY_NAMES[a.getUTCDay()]})`;const endYear=includeYear&&a.getUTCFullYear()!==b.getUTCFullYear()?`${b.getUTCFullYear()}년 `:'';return `${startText}~${endYear}${b.getUTCMonth()+1}월 ${b.getUTCDate()}일(${DAY_NAMES[b.getUTCDay()]})`}
    function sortedMembers(){return [...members].sort((a,b)=>(roleOrder[a.role]||99)-(roleOrder[b.role]||99)||String(a.name||'').localeCompare(String(b.name||''),'ko-KR'))}
    function formatJoinedAt(value){return /^\d{4}-\d{2}-\d{2}$/.test(String(value||''))?String(value).replaceAll('-','.'):'미등록'}
    function dailyRecord(memberId,date=recordDate.value){return daily.find(item=>item.memberId===memberId&&item.recordDate===date)||null}
    function dailyRows(memberId,weekStart){const weekEnd=addDays(weekStart,6);return daily.filter(item=>item.memberId===memberId&&item.recordDate>=weekStart&&item.recordDate<=weekEnd)}
    function weeklyRecord(memberId,weekStart=mondayForDate(recordDate.value)){return weekly.find(item=>item.memberId===memberId&&item.weekStart===weekStart)||null}
    function weekCounts(memberId,weekStart){const rows=dailyRows(memberId,weekStart),participated=rows.filter(item=>item.buildStatus==='achieved_under70').length,participatedHigh=rows.filter(item=>item.buildStatus==='achieved_70plus').length;return {participated,participatedHigh,participatedTotal:participated+participatedHigh,missed:Math.max(0,7-participated-participatedHigh),absent:rows.filter(item=>Number(item.absent)===1||item.absent===true).length}}
    function buildOptions(selected){return Object.entries(BUILD_LABELS).map(([value,label])=>`<option value="${value}" ${value===selected?'selected':''}>${label}</option>`).join('')}
    function competitionOptions(selected){return Object.entries(COMP_LABELS).map(([value,label])=>`<option value="${value}" ${value===selected?'selected':''}>${label}</option>`).join('')}
    function compTone(value){return value==='achieved'?'tone-achieved':value==='missed_officer'?'tone-officer':'tone-missed'}
    function ratioBar(counts){const under=counts.participated,high=counts.participatedHigh,missed=counts.missed;return `<div class="ratio-wrap" aria-label="달성 70점 미만 ${under}일, 달성 70점 이상 ${high}일, 미달성 ${missed}일"><div class="ratio-bar"><span class="ratio-segment under" style="width:${under/7*100}%" title="달성(70점-) ${under}일">${under||''}</span><span class="ratio-segment high" style="width:${high/7*100}%" title="달성(70점↑) ${high}일">${high||''}</span><span class="ratio-segment missed" style="width:${missed/7*100}%" title="미달성 ${missed}일">${missed||''}</span></div><div class="ratio-caption"><span><i class="ratio-dot under"></i>70점- ${under}</span><span><i class="ratio-dot high"></i>70점↑ ${high}</span><span><i class="ratio-dot missed"></i>미달성 ${missed}</span></div></div>`}
    function showToast(message,error=false){clearTimeout(toastTimer);saveToast.textContent=message;saveToast.className=`save-toast show${error?' error':''}`;toastTimer=setTimeout(()=>{if(pendingSaves===0)saveToast.className='save-toast'},1500)}
    async function readPayload(response){const text=await response.text();try{return text?JSON.parse(text):{}}catch(_){throw new Error('서버 응답을 확인하지 못했습니다.')}}
    async function save(body){pendingSaves+=1;showToast('저장 중...');try{const response=await fetch('/api/guild-management',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const payload=await readPayload(response);if(!response.ok)throw new Error(payload.error||'저장하지 못했습니다.');showToast('저장 완료');return payload}catch(error){showToast(error.message,true);throw error}finally{pendingSaves=Math.max(0,pendingSaves-1)}}
    async function load(){entryContent.innerHTML='<div class="empty-state">기록을 불러오는 중입니다.</div>';try{const response=await fetch(`/api/guild-management?month=${encodeURIComponent(monthPicker.value)}`,{cache:'no-store'});const payload=await readPayload(response);if(!response.ok)throw new Error(payload.error||'길드원 관리 기록을 불러오지 못했습니다.');members=payload.members||[];daily=payload.daily||[];weekly=payload.weekly||[];renderAll()}catch(error){entryContent.innerHTML=`<div class="empty-state">${esc(error.message)}</div>`;statsContent.innerHTML=`<div class="empty-state">${esc(error.message)}</div>`}}
    function renderSuggestions(){document.getElementById('memberSuggestions').innerHTML=sortedMembers().map(member=>`<option value="${esc(member.name)}"></option>`).join('')}
    function searchedMember(){const query=memberSearch.value.trim().toLocaleLowerCase('ko-KR');if(!query)return null;const list=sortedMembers();return list.find(member=>String(member.name||'').toLocaleLowerCase('ko-KR')===query)||list.find(member=>String(member.name||'').toLocaleLowerCase('ko-KR').includes(query))||null}
    function renderEntries(){
      const list=sortedMembers(),weekStart=mondayForDate(recordDate.value);document.getElementById('entryTitle').textContent=`${rangeLabel(weekStart,true)} 기록 입력`;
      if(!list.length){entryContent.innerHTML='<div class="empty-state">등록된 길드원이 없습니다.</div>';return}
      entryContent.innerHTML=`<div class="table-scroll"><table class="data-table entry-table"><colgroup><col class="col-no"><col class="col-member"><col class="col-build"><col class="col-count"><col class="col-count"><col class="col-competition"><col class="col-number"><col class="col-number"><col class="col-absent"><col class="col-memo"></colgroup><thead><tr><th rowspan="2" class="sticky-one">번호</th><th rowspan="2" class="sticky-two">길드원</th><th colspan="3" class="group-build">길드 건설</th><th colspan="3" class="group-competition">길드 경쟁전</th><th colspan="2" class="group-attendance">접속 기록</th></tr><tr><th>일일 건설</th><th>참여/일</th><th>미달성/일</th><th>기본 임무</th><th>추가 임무</th><th>총 점수</th><th>미접 일수</th><th>메모</th></tr></thead><tbody>${list.map((member,index)=>{const day=dailyRecord(member.id)||{buildStatus:'',absent:0},counts=weekCounts(member.id,weekStart),week=weeklyRecord(member.id,weekStart)||{competitionStatus:'missed',extraMissions:0,totalScore:0,memo:''},absent=Number(day.absent)===1||day.absent===true;return `<tr data-member-id="${esc(member.id)}"><td class="sticky-one sequence">${index+1}</td><td class="sticky-two member-cell"><span class="member-name">${esc(member.name)}</span><span class="member-role">${esc(member.role||'멤버')}</span><span class="member-joined">가입 ${esc(formatJoinedAt(member.joinedAt))}</span></td><td><select class="cell-control build-select" data-value="${esc(day.buildStatus||'')}">${buildOptions(day.buildStatus||'')}</select></td><td class="participation-cell">${counts.participatedTotal}일</td><td class="missed-cell">${counts.missed}일</td><td><select class="cell-control competition-select" data-value="${esc(week.competitionStatus||'missed')}">${competitionOptions(week.competitionStatus||'missed')}</select></td><td><input class="cell-control extra-input" type="number" inputmode="numeric" min="0" max="999" value="${number(week.extraMissions)}"></td><td><input class="cell-control score-input" type="number" inputmode="numeric" min="0" max="9999999" value="${number(week.totalScore)}"></td><td><label class="absence-toggle${absent?' checked':''}"><input class="absent-check" type="checkbox" ${absent?'checked':''}><span>${absent?'미접':'접속'}</span></label></td><td><textarea class="cell-control memo-input" maxlength="500" rows="1" placeholder="메모 입력">${esc(week.memo||'')}</textarea></td></tr>`}).join('')}</tbody></table></div>`
    }
    function renderStats(){
      const member=searchedMember();if(!member){statsPanel.hidden=true;return}statsPanel.hidden=false;const joinedLabel=member.joinedAt?formatJoinedAt(member.joinedAt):'가입일 미등록';document.getElementById('statsTitle').textContent=`${monthPicker.value.replace('-','년 ')}월 통계 · ${member.name} · ${member.role||'멤버'} · ${joinedLabel}`;
      const rows=monthWeeks(monthPicker.value).map(weekStart=>{const counts=weekCounts(member.id,weekStart),week=weeklyRecord(member.id,weekStart)||{competitionStatus:'missed',extraMissions:0,totalScore:0,memo:''};return {weekStart,counts,week}});
      statsContent.innerHTML=`<div class="table-scroll"><table class="data-table stats-table"><colgroup><col class="col-range"><col class="col-build"><col class="col-count"><col class="col-count"><col class="col-count"><col class="col-competition"><col class="col-number"><col class="col-number"><col class="col-number"><col class="col-memo"></colgroup><thead><tr><th rowspan="2">기간</th><th colspan="4" class="group-build">길드 건설</th><th colspan="3" class="group-competition">길드 경쟁전</th><th colspan="2" class="group-attendance">접속 기록</th></tr><tr><th>일일 건설</th><th>참여/일</th><th>참여↑/일</th><th>미달성/일</th><th>기본 임무</th><th>추가 임무</th><th>총 점수</th><th>미접 일수</th><th>메모</th></tr></thead><tbody>${rows.map(row=>`<tr><td class="range-cell">${rangeLabel(row.weekStart)}</td><td>${ratioBar(row.counts)}</td><td>${row.counts.participated}일</td><td>${row.counts.participatedHigh}일</td><td>${row.counts.missed}일</td><td><span class="status-text ${compTone(row.week.competitionStatus||'missed')}">${esc(COMP_LABELS[row.week.competitionStatus||'missed'])}</span></td><td>${number(row.week.extraMissions)}회</td><td>${fmt(row.week.totalScore)}점</td><td>${row.counts.absent}일</td><td class="memo-view">${esc(row.week.memo||'-')}</td></tr>`).join('')}</tbody></table></div>`
    }
    function renderAll(){renderSuggestions();renderEntries();renderStats()}function updateSelectTone(select){select.dataset.value=select.value}
    function updateLocalDaily(memberId,changes){let row=dailyRecord(memberId);if(!row){row={memberId,recordDate:recordDate.value,buildStatus:'',absent:0};daily.push(row)}Object.assign(row,changes);if(!row.buildStatus&&!Number(row.absent))daily=daily.filter(item=>item!==row)}
    async function saveDaily(row){const memberId=row.dataset.memberId,buildSelect=row.querySelector('.build-select'),absentCheck=row.querySelector('.absent-check'),weekStart=mondayForDate(recordDate.value);updateSelectTone(buildSelect);updateLocalDaily(memberId,{buildStatus:buildSelect.value,absent:absentCheck.checked?1:0});const counts=weekCounts(memberId,weekStart);row.querySelector('.participation-cell').textContent=`${counts.participatedTotal}일`;row.querySelector('.missed-cell').textContent=`${counts.missed}일`;row.querySelector('.absence-toggle').classList.toggle('checked',absentCheck.checked);row.querySelector('.absence-toggle span').textContent=absentCheck.checked?'미접':'접속';renderStats();await save({scope:'daily',month:recordDate.value.slice(0,7),date:recordDate.value,memberId,buildStatus:buildSelect.value,absent:absentCheck.checked})}
    async function saveWeekly(row){const memberId=row.dataset.memberId,select=row.querySelector('.competition-select'),extraMissions=number(row.querySelector('.extra-input').value),totalScore=number(row.querySelector('.score-input').value),memo=row.querySelector('.memo-input').value.trim(),weekStart=mondayForDate(recordDate.value);updateSelectTone(select);let record=weeklyRecord(memberId,weekStart);if(!record){record={memberId,weekStart};weekly.push(record)}Object.assign(record,{competitionStatus:select.value,extraMissions,totalScore,memo});renderStats();await save({scope:'weekly',month:recordDate.value.slice(0,7),weekStart,memberId,competitionStatus:select.value,extraMissions,totalScore,memo})}
    entryContent.addEventListener('change',event=>{const row=event.target.closest('tr[data-member-id]');if(!row)return;if(event.target.matches('.build-select,.absent-check'))saveDaily(row).catch(()=>load());else if(event.target.matches('.competition-select,.extra-input,.score-input,.memo-input'))saveWeekly(row).catch(()=>load())});memberSearch.addEventListener('input',renderStats);
    monthPicker.addEventListener('change',()=>{const today=kstDate();recordDate.value=today.startsWith(`${monthPicker.value}-`)?today:`${monthPicker.value}-01`;load()});recordDate.addEventListener('change',()=>{const selectedMonth=recordDate.value.slice(0,7);if(selectedMonth&&selectedMonth!==monthPicker.value){monthPicker.value=selectedMonth;load()}else renderEntries()});document.getElementById('refreshButton').addEventListener('click',load);
    lastToday=kstDate();monthPicker.value=lastToday.slice(0,7);recordDate.value=lastToday;load();setInterval(()=>{const today=kstDate();if(today===lastToday)return;const followedToday=recordDate.value===lastToday;lastToday=today;if(followedToday){recordDate.value=today;if(monthPicker.value!==today.slice(0,7)){monthPicker.value=today.slice(0,7);load()}else renderEntries()}},60000);
  })();
  </script>
