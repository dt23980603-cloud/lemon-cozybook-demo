<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>레몬공책 PIN 변경</title><link rel="icon" href="/images/branding/lemon-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth.css"><link rel="manifest" href="/manifest.webmanifest?v=4.43">
</head><body><main class="auth-shell">
  <div class="auth-brand"><img src="/icons/icon-v4.12-192.png" alt=""><h1>PIN 번호 변경</h1><p id="memberLabel"></p></div>
  <section class="auth-card"><h2 id="title">새 PIN을 설정해주세요</h2><p class="auth-help">PIN은 숫자 6~12자리로 설정할 수 있습니다.</p>
    <form id="pinForm">
      <label class="auth-field" id="currentWrap" hidden>현재 PIN<input id="currentPin" type="password" inputmode="numeric" maxlength="12" autocomplete="current-password"></label>
      <label class="auth-field">새 PIN<input id="newPin" type="password" inputmode="numeric" minlength="6" maxlength="12" autocomplete="new-password" required></label>
      <label class="auth-field">새 PIN 확인<input id="newPinConfirm" type="password" inputmode="numeric" minlength="6" maxlength="12" autocomplete="new-password" required></label>
      <button class="auth-primary" id="saveBtn" type="submit">PIN 변경</button>
    </form><div class="auth-status" id="status" aria-live="polite"></div>
    <div class="auth-links"><a href="/index.html">메인으로 돌아가기</a></div>
  </section>
</main><script>
let mustChange=true;const statusEl=document.getElementById('status');
fetch('/api/auth/me',{cache:'no-store'}).then(async r=>{const p=await r.json();if(!r.ok)throw new Error();mustChange=Boolean(p.mustChangePin);document.getElementById('memberLabel').textContent=`${p.memberName} · ${p.role==='admin'?'관리자':'길드원'}`;document.getElementById('currentWrap').hidden=mustChange;document.getElementById('title').textContent=mustChange?'임시 PIN을 변경해주세요':'PIN 번호 변경';}).catch(()=>location.replace('/login.html'));
document.getElementById('pinForm').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('saveBtn');button.disabled=true;statusEl.className='auth-status';statusEl.textContent='PIN을 변경하는 중...';
  const body={currentPin:document.getElementById('currentPin').value,newPin:document.getElementById('newPin').value,newPinConfirm:document.getElementById('newPinConfirm').value};
  try{const r=await fetch('/api/auth/change-pin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const p=await r.json();if(!r.ok)throw new Error(p.error||'PIN을 변경하지 못했습니다.');statusEl.className='auth-status success';statusEl.textContent='PIN이 변경되었습니다.';setTimeout(()=>location.replace('/index.html'),500)}catch(error){statusEl.className='auth-status error';statusEl.textContent=error.message;button.disabled=false}
});
</script></body></html>
