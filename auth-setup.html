<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>demo 레몬공책 최초 관리자 설정</title><link rel="icon" href="/images/branding/lemon-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth.css"><link rel="manifest" href="/manifest.webmanifest?v=4.40">
</head><body><main class="auth-shell">
  <div class="auth-brand"><img src="/icons/icon-v4.12-192.png" alt=""><h1>최초 관리자 설정</h1><p>demo_v4.40 로그인 시스템</p></div>
  <section class="auth-card">
    <div class="auth-note">Cloudflare 데모 프로젝트에 등록한 <b>LEMON_AUTH_SETUP_KEY</b>를 입력해주세요. 관리자 계정이 만들어지면 이 설정 페이지는 다시 사용할 수 없습니다.</div>
    <div class="auth-step" id="keyStep">
      <div class="auth-step-title">1. 1회 설정키 확인</div>
      <label class="auth-field">설정키<input id="setupKey" type="password" autocomplete="off" required></label>
      <button class="auth-primary" id="loadMembers" type="button">길드원 불러오기</button>
    </div>
    <form class="auth-step" id="accountStep" hidden>
      <div class="auth-step-title">2. 세영씨 관리자 계정 만들기</div>
      <label class="auth-field">관리자로 연결할 길드원<select id="memberId" required></select></label>
      <label class="auth-field">관리자 로그인 코드<input id="loginCode" maxlength="32" value="LEMON-ADMIN" autocomplete="username" required></label>
      <label class="auth-field">PIN 번호<input id="pin" type="password" inputmode="numeric" minlength="6" maxlength="12" autocomplete="new-password" required></label>
      <label class="auth-field">PIN 번호 확인<input id="pinConfirm" type="password" inputmode="numeric" minlength="6" maxlength="12" autocomplete="new-password" required></label>
      <button class="auth-primary" id="createAdmin" type="submit">관리자 계정 만들기</button>
    </form>
    <div class="auth-status" id="status" aria-live="polite"></div>
    <div class="auth-links"><a href="/login.html">로그인 화면으로</a></div>
  </section>
</main><script>
const statusEl=document.getElementById('status'),keyInput=document.getElementById('setupKey'),accountStep=document.getElementById('accountStep');
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
const setStatus=(text,type='')=>{statusEl.textContent=text;statusEl.className=`auth-status ${type}`};
document.getElementById('loadMembers').addEventListener('click',async()=>{const button=document.getElementById('loadMembers');button.disabled=true;setStatus('길드원 목록을 확인하는 중...');
  try{const r=await fetch('/api/auth/bootstrap',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'members',setupKey:keyInput.value})});const p=await r.json();if(!r.ok)throw new Error(p.error||'불러오지 못했습니다.');
    const members=Array.isArray(p.members)?p.members:[];if(!members.length)throw new Error('먼저 데모 길드원 목록을 준비해주세요.');
    document.getElementById('memberId').innerHTML=members.map(m=>`<option value="${esc(m.id)}">${esc(m.role||'멤버')} · ${esc(m.name||'')}</option>`).join('');accountStep.hidden=false;setStatus('관리자로 사용할 길드원을 선택해주세요.','success')}
  catch(error){setStatus(error.message,'error');button.disabled=false}
});
document.getElementById('accountStep').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('createAdmin');button.disabled=true;setStatus('관리자 계정을 만드는 중...');
  const body={action:'create',setupKey:keyInput.value,memberId:document.getElementById('memberId').value,loginCode:document.getElementById('loginCode').value,pin:document.getElementById('pin').value,pinConfirm:document.getElementById('pinConfirm').value};
  try{const r=await fetch('/api/auth/bootstrap',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const p=await r.json();if(!r.ok)throw new Error(p.error||'관리자 계정을 만들지 못했습니다.');setStatus('관리자 설정이 완료되었습니다.','success');location.replace('/admin-accounts.html')}
  catch(error){setStatus(error.message,'error');button.disabled=false}
});
</script></body></html>
