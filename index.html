<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>demo 레몬 | 더 코지 플로리스트</title>
    <link rel="icon" type="image/png" href="images/branding/lemon-favicon.png">

    <!-- 고운 바탕 폰트 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* 모든 글자를 Gowun Batang으로 지정 */
        *, body, input, button, select, textarea {
            font-family: 'Gowun Batang', serif !important;
        }

        body {
            background-color: #f9f9f9;
            margin: 20px;
            color: #333;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .notice-box {
            background-color: #fff9db;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
        }

        .notice-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .notice-content p {
            margin: 6px 0;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        /* 버튼 메뉴 스타일 */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #fff9db;
            border: 1px solid #333;
            border-radius: 8px;
            color: #333;
            font-weight: bold;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.05);
        }

        .button-grid .nav-row-three {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 15px;
        }

        .nav-btn:hover {
            background-color: #fff2cc;
            transform: translateY(-2px);
            box-shadow: 2px 4px 8px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 8px 10px;
            text-align: center;
            font-size: 0.9rem;
            vertical-align: middle;
        }

        th {
            background-color: #fff9db;
            font-weight: bold;
        }

        /* 표 헤더 / 제목 스타일 */
        .table-header-box {
            background-color: #fff9db;
            border: 1px solid #333;
            border-bottom: none;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-title {
            font-weight: bold;
            font-size: 1rem;
        }

        .btn-reset {
            background-color: #ff6b6b;
            color: #fff;
            border: 1px solid #d93838;
            padding: 4px 10px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-reset:hover {
            background-color: #fa5252;
        }

        .btn-update-delete {
            flex: 0 0 auto;
            margin-left: 10px;
            width: 28px;
            height: 28px;
            border: 1px solid #e2b6b6;
            border-radius: 6px;
            background: #fff5f5;
            color: #c94d4d;
            cursor: pointer;
            font-size: 0.92rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-update-delete:hover {
            background: #ffe3e3;
        }

        .btn-update-flower {
            border: 1px solid #8fa98a;
            border-radius: 6px;
            background: #f7fbf5;
            color: #355c35;
            padding: 5px 9px;
            font-size: .76rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .btn-update-flower:hover {
            background: #eef7e9;
        }

        .update-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        /* 업데이트 내역 본문: PC/모바일 공통 가독성 */
        #updateTable tbody td {
            color: #111;
        }

        #updateTable .grade-text {
            font-weight: 700;
        }

        #updateTable .grade-text-N { color: #4f7a2f; }
        #updateTable .grade-text-R { color: #2f78a8; }
        #updateTable .grade-text-SR { color: #8b4fb3; }
        #updateTable .grade-text-SSR { color: #d88900; }
        #updateTable .grade-text-UR { color: #c94d4d; }

        /* 입력 양식 스타일: PC/모바일 공통으로 외곽선을 연하게 */
        .add-form-card {
            background: #fff;
            border: 1px solid #d8d8d8;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .form-row input,

            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .input-category {
            width: 100px;
        }

        .input-content {
            flex: 1;
        }

        .btn-add {
            background-color: #fff2cc;
            border: 1px solid #333;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background-color: #ffd94e;
        }

        .btn-edit {
            background-color: #ffffff;
            border: 1px solid #777;
            padding: 4px 9px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-edit:hover {
            background-color: #f1f1f1;
        }

        .btn-cancel-edit {
            display: none;
            background-color: #f5f5f5;
            border: 1px solid #aaa;
            padding: 8px 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .edit-guide {
            display: none;
            margin-top: 2px;
            color: #777;
            font-size: 0.8rem;
        }



        /* 메인 배너: PC / 모바일 전용 이미지 자동 전환 */
        .main-banner {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto 20px;
        }

        .main-banner img {
            display: block;
            width: 100%;
            height: auto;
        }

            display: none !important;

        /* 모바일 전용 레이아웃: PC 스타일은 그대로 유지 */
        @media (max-width: 480px) {
            .main-banner-pc { display: none !important; }
            .main-banner-mobile { display: block !important; }

                margin: 12px;

            .container {
                display: flex;
                flex-direction: column;
                gap: 16px;
                width: 100%;
                max-width: none;

            }

            .left-panel,

                width: 100%;
                min-width: 0;
                gap: 14px;
            }

            /* 1. NOTICE를 화면 너비 전체로 */
            .notice-box {

            .nav-btn {

                box-sizing: border-box;
                text-align: center;
                font-size: 0.98rem;

                word-break: keep-all;

            /* 3. 업데이트 영역을 버튼 아래 전체 너비로 */
            .right-panel > div:first-child {
                width: 100%;
                min-width: 0;
                overflow-x: auto;

            }

            .table-header-box {
                box-sizing: border-box;
                width: 100%;
                padding: 9px 10px;
                gap: 8px;
            }

            .table-title {
                font-size: 0.96rem;
            }

            .btn-reset {

                padding: 5px 8px;

            .btn-update-delete {

            }

            }

            #updateTable th,
            #updateTable td {
                padding: 6px 4px;
                font-size: 0.72rem;

                word-break: break-word;
            }

            #updateTable .btn-edit {

                font-size: 0.68rem;
                white-space: nowrap;
            }

            /* 업데이트 등록 폼도 모바일에서 입력하기 쉽게 정렬 */

                box-sizing: border-box;

                padding: 12px;
            }

            .form-row {
                display: grid;
                grid-template-columns: 1fr 1fr auto;
                gap: 8px;

            }

            .form-row input,
            .form-row select,
            .form-row button {
                box-sizing: border-box;

            .input-category {

            .input-content {

            }

            #selectGrade {

                grid-column: 1 / 2;
            }

            #btnSaveUpdate {
                grid-column: 2 / 3;
                padding: 8px 10px;
            }

            #btnCancelEdit {

            }

            .edit-guide {
                font-size: 0.72rem;
                line-height: 1.45;
            }

        }

    </style>

    <div class="container">
        <!-- 좌측 영역 (공지사항 & 이동 버튼 4개) -->
        <div class="left-panel">
            <div class="notice-box">
                <div class="notice-title">레몬 NOTICE | 새로운 길드원 여러분 환영합니다!</div>

                    </thead>
                    <tbody id="updateTbody">
                        <tr><td colspan="2" style="color:#888;">업데이트 내역을 불러오는 중입니다.</td></tr>

            </div>

    <script>
        const UPDATES_API = '/api/updates';
        let updateList = [];
        let updatePollTimer = null;

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
        }

        function formatUpdateDate(timestamp) {
            if (!timestamp) return '-';
            const parts = new Intl.DateTimeFormat('ko-KR', {
                timeZone: 'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit'
            }).formatToParts(new Date(timestamp));
            const map = Object.fromEntries(parts.map(p => [p.type, p.value]));
            return `${map.year}.${map.month}.${map.day}`;
        }

        function renderTable() {
            const tbody = document.getElementById('updateTbody');
            if (!updateList.length) {
                tbody.innerHTML = '<tr><td colspan="2" style="color:#888;">등록된 업데이트 내역이 없습니다.</td></tr>';
                return;
            }
            tbody.innerHTML = updateList.map(item => {
                const label = item.category ? `[${item.category}] ${item.name}` : item.name;
                const score = item.guildScore == null ? '-' : `${item.guildScore}점`;
                return `<tr>
                    <td>${escapeHtml(formatUpdateDate(item.createdAt))}</td>
                    <td style="text-align:left;padding-left:12px;">
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                            <div style="min-width:0;flex:1;">
                                <div style="font-size:.72rem;color:#999;margin-bottom:2px;">${item.action === 'edit' ? '정보 수정' : '신규 추가'}</div>
                                <div style="font-weight:bold;word-break:keep-all;">${escapeHtml(label)}</div>
                                <div style="margin-top:4px;font-size:.82rem;color:#666;"><span class="grade-text grade-text-${escapeHtml(item.grade)}">${escapeHtml(item.grade)}</span> · ⚔️ ${escapeHtml(score)}</div>
                            </div>
                            <div class="update-actions">
                                <button type="button" class="btn-update-flower" data-flower-key="${escapeHtml(item.flowerKey || '')}">꽃 정보 보기</button>
                                <button type="button" class="btn-update-delete" title="이 공지만 삭제" aria-label="이 공지만 삭제" onclick="deleteUpdate(${Number(item.id)})">🗑️</button>
                            </div>
                        </div>
                    </td>
                </tr>`;
            }).join('');
            tbody.querySelectorAll('.btn-update-flower').forEach(button => {
                button.addEventListener('click', () => openUpdateFlower(button.dataset.flowerKey));
            });
        }

        function openUpdateFlower(flowerKey) {
            if (!flowerKey) {
                alert('연결된 꽃 정보를 찾을 수 없습니다.');
                return;
            }
            location.href = `page5.html?flower=${encodeURIComponent(flowerKey)}&from=updates`;
        }

        async function deleteUpdate(id) {
            const item = updateList.find(entry => Number(entry.id) === Number(id));
            const label = item ? (item.category ? `[${item.category}] ${item.name}` : item.name) : '이 공지';
            if (!confirm(`${label}\n\n이 업데이트 공지만 삭제할까요?\n꽃 데이터와 이미지는 삭제되지 않습니다.`)) return;

            try {
                const response = await fetch(`${UPDATES_API}?id=${encodeURIComponent(id)}`, { method:'DELETE' });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(payload.error || `DELETE ${response.status}`);
                updateList = updateList.filter(entry => Number(entry.id) !== Number(id));
                renderTable();
            } catch (error) {
                console.error('업데이트 공지 삭제 실패', error);
                alert(`공지 삭제에 실패했습니다.\n${error.message || error}`);
            }
        }

        async function clearAllUpdates() {
            if (!updateList.length) {
                alert('삭제할 업데이트 내역이 없습니다.');
                return;
            }
            if (!confirm('업데이트 내역을 전체 초기화할까요?\n\n공지 기록만 삭제되며 전체 꽃 도감, 길드 꽃 도감, R2 이미지는 그대로 유지됩니다.')) return;

            const button = document.getElementById('clearUpdatesBtn');
            if (button) button.disabled = true;
            try {
                const response = await fetch(`${UPDATES_API}?all=1`, { method:'DELETE' });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(payload.error || `DELETE ${response.status}`);
                updateList = [];
                renderTable();
            } catch (error) {
                console.error('업데이트 내역 전체 초기화 실패', error);
                alert(`전체 초기화에 실패했습니다.\n${error.message || error}`);
            } finally {
                if (button) button.disabled = false;
            }
        }

        async function fetchUpdates() {
            try {
                const response = await fetch(UPDATES_API, { cache:'no-store' });
                if (!response.ok) throw new Error(`GET ${response.status}`);
                const payload = await response.json();
                updateList = Array.isArray(payload.updates) ? payload.updates : [];
                renderTable();
            } catch (error) {
                console.warn('업데이트 내역 D1 조회 실패', error);
                document.getElementById('updateTbody').innerHTML = '<tr><td colspan="2" style="color:#a66;">업데이트 내역을 불러오지 못했습니다.</td></tr>';
            }
        }

        window.addEventListener('load', () => {
            fetchUpdates();
            updatePollTimer = setInterval(fetchUpdates, 5000);
        });
        window.addEventListener('focus', fetchUpdates);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) fetchUpdates(); });
    </script>

<script id="pwa-auto-update-script">
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        const registration = await navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' });

        // 앱을 열 때마다 새 서비스 워커가 있는지 즉시 확인합니다.
        await registration.update();

        // 앱을 오래 켜둔 경우에도 주기적으로 새 배포본을 확인합니다.
        setInterval(() => registration.update().catch(() => {}), 60 * 1000);

        registration.addEventListener('updatefound', () => {
          const worker = registration.installing;
          if (!worker) return;

          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              // 새 버전이 준비되면 즉시 활성화합니다.
              worker.postMessage('SKIP_WAITING');
            }
          });
        });

        // 새 서비스 워커가 페이지 제어권을 얻으면 한 번만 자동 새로고침합니다.
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          const key = 'lemon_pwa_auto_reload';
          if (sessionStorage.getItem(key) === '1') return;
          sessionStorage.setItem(key, '1');
          window.location.reload();
        });

        // 정상적으로 새 페이지가 열린 뒤 플래그를 해제해 다음 업데이트도 자동 적용되게 합니다.
        setTimeout(() => sessionStorage.removeItem('lemon_pwa_auto_reload'), 5000);
      } catch (err) {
        console.warn('PWA service worker registration/update failed:', err);
      }
    });
  }
</script>


<button id="pwaInstallBtn" type="button" aria-label="레몬 앱 설치">🍋 앱 설치</button>
<script id="pwa-install-script">
  (() => {
    let deferredPrompt = null;
    const btn = document.getElementById('pwaInstallBtn');
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    // 설치 전에는 항상 버튼을 표시합니다.
    btn.style.display = isStandalone ? 'none' : 'block';

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isStandalone) btn.style.display = 'block';
    });

    btn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        return;
      }

      // 브라우저가 설치 프롬프트를 아직 제공하지 않는 경우에도 버튼은 유지하고 안내합니다.
      const ua = navigator.userAgent.toLowerCase();
      const isIOS = /iphone|ipad|ipod/.test(ua);
      if (isIOS) {
        alert('Safari의 공유 버튼을 누른 뒤 “홈 화면에 추가”를 선택해주세요.');
      } else {
        alert('Chrome에서 이 페이지를 열고 잠시 이용한 뒤 다시 눌러주세요. 브라우저 메뉴의 “앱 설치” 또는 “홈 화면에 추가”를 이용해도 됩니다.');
      }
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      btn.style.display = 'none';
    });
  })();
</script>
