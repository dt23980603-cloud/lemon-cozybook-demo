<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>demo 레몬공책 로그인</title><link rel="icon" href="/images/branding/lemon-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth.css"><link rel="manifest" href="/manifest.webmanifest?v=4.46">
</head><body>
<main class="auth-shell">
  <div class="auth-brand"><img src="/icons/icon-v4.12-192.png" alt=""><h1>🍋 레몬공책 DEMO</h1><p>길드원 로그인</p></div>
  <section class="auth-card">
    <h2>레몬공책에 들어가기</h2>
    <p class="auth-help">전달받은 로그인 코드와 PIN 번호를 입력해주세요. 한 번 로그인하면 이 기기에서는 로그인 상태가 유지됩니다.</p>
    <form id="loginForm">
      <label class="auth-field">로그인 코드<input id="loginCode" autocomplete="username" autocapitalize="characters" maxlength="32" placeholder="예: LM-ABCD-2345" required></label>
      <label class="auth-field">PIN 번호<input id="pin" type="password" inputmode="numeric" autocomplete="current-password" minlength="6" maxlength="12" placeholder="숫자 6자리 이상" required></label>
      <button class="auth-primary" id="loginBtn" type="submit">로그인</button>
    </form>
    <div class="auth-status" id="status" aria-live="polite"></div>
    <div class="auth-links"><a id="setupLink" href="/auth-setup.html" hidden>최초 관리자 설정</a></div>
  </section>
</main>
<script>
const form=document.getElementById('loginForm'),statusEl=document.getElementById('status'),button=document.getElementById('loginBtn');
const nextRaw=new URLSearchParams(location.search).get('next')||'/index.html';
const next=nextRaw.startsWith('/')&&!nextRaw.startsWith('//')?nextRaw:'/index.html';
const readPayload=async response=>{const text=await response.text();try{return text?JSON.parse(text):{}}catch(_){throw new Error(response.status>=500?'로그인 서버 처리 중 오류가 발생했습니다.':'로그인 서버 응답을 확인하지 못했습니다.')}};
async function checkStatus(){
  try{const r=await fetch('/api/auth/status',{cache:'no-store'});const p=await readPayload(r);
    if(p.authenticated){location.replace(p.mustChangePin?'/change-pin.html':next);return}
    document.getElementById('setupLink').hidden=p.initialized;
    if(!p.initialized&&!p.setupConfigured){statusEl.className='auth-status error';statusEl.textContent='관리자가 Cloudflare에 1회 설정키를 등록해야 합니다.'}
  }catch(_){statusEl.className='auth-status error';statusEl.textContent='로그인 서버에 연결하지 못했습니다.'}
}
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;statusEl.className='auth-status';statusEl.textContent='로그인 중...';
  try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({loginCode:document.getElementById('loginCode').value,pin:document.getElementById('pin').value})});const p=await readPayload(r);if(!r.ok)throw new Error(p.error||'로그인에 실패했습니다.');location.replace(p.mustChangePin?'/change-pin.html':next)}
  catch(error){statusEl.className='auth-status error';statusEl.textContent=error.message;button.disabled=false}
});
checkStatus();
</script></body></html>
