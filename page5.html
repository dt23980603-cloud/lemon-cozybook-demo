<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전체 꽃 도감 | 레몬</title>
    <link rel="icon" type="image/png" href="images/branding/lemon-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, body, input, button, select, textarea { font-family: 'Gowun Batang', serif; box-sizing: border-box; }
    body { background:#f9f9f9; margin:15px; color:#333; }
    .container-full { width:100%; background:#fff; padding:20px; border:1px solid #ccc; border-radius:8px; box-shadow:2px 2px 5px rgba(0,0,0,.05); }
    .header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; padding-bottom:10px; }
    .header-left { display:flex; align-items:center; gap:12px; }
    .nav-btn-home { display:inline-flex; align-items:center; justify-content:center; width:50px; height:50px; background:#fff; border:1px solid #ccc; border-radius:8px; text-decoration:none; font-size:1.2rem; transition:.2s; }
    .nav-btn-home:hover { background:#fff0f0; transform:translateY(-2px); }
    .subtitle { margin:3px 0 0; color:#777; font-size:.88rem; }
    .header-actions { display:flex; align-items:center; gap:8px; }
    .btn-delete-flower { width:42px; height:42px; padding:0; background:transparent; border:0; color:#9c3030; border-radius:6px; font-size:1.35rem; line-height:1; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s; }
    .btn-delete-flower:hover { background:#fff0f0; transform:translateY(-1px); }

    .btn-add-flower { padding:9px 14px; background:#fff0f0; border:1px solid #666; border-radius:7px; font-weight:bold; cursor:pointer; white-space:nowrap; }
    .btn-add-flower:hover { background:#fae0e0; transform:translateY(-1px); }
    .add-flower-card { background:#fff; border:2px solid #333; border-radius:10px; padding:20px; width:650px; max-width:100%; max-height:90vh; overflow-y:auto; box-shadow:0 4px 15px rgba(0,0,0,.2); }
    .add-form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .add-form-grid label { display:flex; flex-direction:column; gap:5px; font-size:.85rem; font-weight:bold; color:#555; }
    .add-form-grid label.span-2 { grid-column:1 / -1; }
    .add-form-grid input, .add-form-grid select, .add-form-grid textarea { width:100%; padding:9px 10px; border:1px solid #aaa; border-radius:6px; background:#fff; font-size:.9rem; }
    .add-form-grid textarea { resize:vertical; min-height:70px; }
    .image-help { color:#999; font-size:.72rem; font-weight:normal; }
    .add-status { min-height:22px; margin-top:10px; font-size:.8rem; color:#777; }
    .add-status.error { color:#a12d2d; }
    .add-status.ok { color:#276b37; }
    .add-form-actions { display:flex; justify-content:flex-end; margin-top:8px; }
    .btn-submit-flower { min-width:100px; padding:9px 16px; border:1px solid #666; border-radius:6px; background:#fff0f0; font-weight:bold; cursor:pointer; }
    .btn-submit-flower:disabled { opacity:.55; cursor:wait; }
    .detail-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; padding-top:12px; border-top:1px solid #eee; }
    .btn-edit-flower { padding:8px 16px; background:#fff0f0; border:1px solid #666; border-radius:6px; font-weight:bold; cursor:pointer; }
    .btn-edit-flower:hover { background:#fae0e0; }
    .edit-current-image { margin-top:4px; color:#777; font-size:.72rem; font-weight:normal; }

    .control-card { background:#f8f9fa; border:1px solid #333; border-radius:6px; padding:15px; margin-bottom:18px; }
    .search-row { display:flex; gap:8px; margin-bottom:12px; }
    .search-input { flex:1; min-width:0; padding:10px 12px; border:1px solid #aaa; border-radius:6px; font-size:.95rem; background:#fff; }
    .btn-clear { padding:9px 14px; background:#fff; border:1px solid #999; border-radius:6px; font-weight:bold; cursor:pointer; }
    .btn-clear:hover { background:#f1f1f1; }
    .guild-check-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; padding:10px 11px; border:1px solid #d8d8d8; border-radius:7px; background:#fff; }
    .guild-check-label { flex:0 0 auto; font-size:.86rem; font-weight:bold; color:#555; white-space:nowrap; }
    .guild-member-select { flex:1; min-width:0; padding:8px 10px; border:1px solid #aaa; border-radius:6px; background:#fff; font-size:.88rem; }
    .guild-check-help { flex:0 0 auto; color:#888; font-size:.74rem; white-space:nowrap; }
    .card-action-row { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .btn-own-check { width:100%; padding:8px 8px; background:#fff; border:1px solid #999; border-radius:6px; font-size:.82rem; font-weight:bold; cursor:pointer; transition:.15s; }
    .btn-own-check:hover { background:#f4f4f4; }
    .btn-own-check.checked { background:#e4f4df; border-color:#76946b; color:#35572e; }
    .btn-own-check:disabled { opacity:.52; cursor:not-allowed; background:#f3f3f3; }
    .tab-container { display:flex; gap:10px; flex-wrap:wrap; }
    .tab-btn { flex:1; min-width:92px; padding:10px 12px; background:#f1f1f1; border:1px solid #ccc; border-radius:8px; font-weight:bold; font-size:.95rem; cursor:pointer; transition:.2s; }
    .tab-btn:hover { filter:brightness(.96); }
    .tab-btn.active[data-grade="ALL"] { background:#fff0f0; border-color:#4b4949; box-shadow:inset 0 -3px 0 #4b4949; }
    .tab-btn.active[data-grade="N"] { background:#d4edbc; border-color:#4b4949; box-shadow:inset 0 -3px 0 #4b4949; }
    .tab-btn.active[data-grade="R"] { background:#bfe1f6; border-color:#4b4949; box-shadow:inset 0 -3px 0 #4b4949; }
    .tab-btn.active[data-grade="SR"] { background:#e6cff2; border-color:#4b4949; box-shadow:inset 0 -3px 0 #4b4949; }
    .tab-btn.active[data-grade="SSR"] { background:#ffe5a0; border-color:#4b4949; box-shadow:inset 0 -3px 0 #4b4949; }
    .tab-btn.active[data-grade="UR"] { background:#ffcfc9; border-color:#4b4949; box-shadow:inset 0 -3px 0 #4b4949; }
    .result-info { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:0 2px 12px; color:#666; font-size:.88rem; }

    .flower-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:16px; }
    .flower-card { background:#fff; border:1px solid #bbb; border-radius:10px; overflow:hidden; box-shadow:2px 2px 5px rgba(0,0,0,.05); transition:.2s; }
    .flower-card:hover { transform:translateY(-2px); box-shadow:2px 5px 10px rgba(0,0,0,.09); }
    .image-wrap { position:relative; background:#f8f9fa; border-bottom:1px solid #ddd; padding:10px 12px 12px; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; gap:8px; }
    .card-top-row { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:28px; }
    .flower-image { width:100%; height:100%; object-fit:contain; }
    .custom-placeholder { display:flex; align-items:center; justify-content:center; font-size:3rem; color:#aaa; background:#f8f9fa; }
    .grade-badge { position:static; display:inline-flex; align-items:center; justify-content:center; min-width:42px; height:28px; padding:0 9px; border:none; border-radius:14px; font-size:.82rem; font-family:Arial, sans-serif; font-weight:800 !important; line-height:1; flex:0 0 auto; background:#d4edbc; }
    .score-badge { display:inline-flex; align-items:center; justify-content:flex-end; min-height:28px; color:#555; font-size:.78rem; font-weight:700; line-height:1; white-space:nowrap; }
    .flower-card.grade-N .grade-badge { background:#d4edbc; }
    .flower-card.grade-R .grade-badge { background:#bfe1f6; }
    .flower-card.grade-SR .grade-badge { background:#e6cff2; }
    .flower-card.grade-SSR .grade-badge { background:#ffe5a0; }
    .flower-card.grade-UR .grade-badge { background:#ffcfc9; }
    .grade-image-crop { width:100%; aspect-ratio:1 / 1; flex:0 0 auto; overflow:hidden; border-radius:22px; display:flex; align-items:center; justify-content:center; background:#f4ecd9; }
    .grade-image-crop .flower-image { width:100%; height:100%; object-fit:contain; }
    .grade-image-crop .custom-placeholder { transform:none; }
    .card-body { padding:13px; text-align:center; }
    .flower-name { font-size:1rem; font-weight:bold; margin-bottom:10px; }
    .btn-open { width:100%; padding:8px 12px; background:#fff0f0; border:1px solid #666; border-radius:6px; font-size:.85rem; font-weight:bold; cursor:pointer; transition:.15s; }
    .btn-open:hover { background:#fae0e0; }
    .empty-result { grid-column:1/-1; padding:50px 15px; text-align:center; color:#888; border:1px dashed #ccc; border-radius:8px; background:#fafafa; }

    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1200; justify-content:center; align-items:center; padding:18px; }
    .modal-overlay.active { display:flex; }
    .flower-detail-card { background:#fff; border:2px solid #333; border-radius:10px; padding:20px; width:520px; max-width:100%; box-shadow:0 4px 15px rgba(0,0,0,.2); }
    .modal-header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:10px; margin-bottom:15px; }
    .modal-title { font-weight:bold; font-size:1.1rem; }
    .modal-close { background:none; border:none; font-size:1.2rem; font-weight:bold; cursor:pointer; color:#888; }
    .modal-close:hover { color:#000; }
    .flower-detail-layout { display:flex; gap:20px; align-items:flex-start; }
    .flower-detail-image { width:160px; height:160px; object-fit:contain; border:1px solid #ccc; border-radius:10px; background:#f8f9fa; flex-shrink:0; }
    .flower-detail-info { flex:1; min-width:0; }
    .flower-detail-name { font-size:1.15rem; font-weight:bold; margin-bottom:12px; }
    .flower-detail-row { display:flex; gap:10px; padding:7px 0; border-bottom:1px solid #eee; font-size:.9rem; line-height:1.45; }
    .flower-detail-label { width:80px; flex-shrink:0; color:#666; font-weight:bold; }
    .flower-detail-source { margin-top:12px; font-size:.75rem; color:#999; }

    .delete-flower-card { background:#fff; border:2px solid #333; border-radius:10px; padding:20px; width:560px; max-width:100%; max-height:80vh; display:flex; flex-direction:column; box-shadow:0 4px 15px rgba(0,0,0,.2); }
    .delete-guide { margin:0 0 12px; color:#777; font-size:.82rem; line-height:1.5; }
    .delete-flower-list { overflow-y:auto; border:1px solid #ddd; border-radius:8px; background:#fafafa; }
    .delete-flower-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; border-bottom:1px solid #e5e5e5; background:#fff; }
    .delete-flower-row:last-child { border-bottom:none; }
    .delete-flower-info { min-width:0; display:flex; align-items:center; gap:9px; }
    .delete-grade { display:inline-flex; align-items:center; justify-content:center; min-width:42px; height:26px; padding:0 8px; border:1px solid #999; border-radius:13px; font-size:.78rem; font-weight:bold; background:#f3f3f3; }
    .delete-flower-name { font-size:.9rem; font-weight:bold; word-break:break-all; }
    .btn-delete-row { flex-shrink:0; padding:6px 11px; background:#fff0f0; border:1px solid #b45a5a; color:#9c3030; border-radius:5px; font-weight:bold; cursor:pointer; }
    .btn-delete-row:hover { background:#f9dede; }
    .delete-empty { padding:28px 15px; text-align:center; color:#888; }

    @media (max-width:700px) { .flower-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:520px) {
      body { margin:8px; }
      .container-full { padding:13px; }
      .header { align-items:flex-start; }
      .header h1 { font-size:1.25rem !important; }
      .header-actions { gap:4px; }
      .btn-add-flower { padding:7px 9px; font-size:.72rem; }
      .add-form-grid { grid-template-columns:1fr; }
      .add-form-grid label.span-2 { grid-column:auto; }

      /* 모바일 검색/등급 필터: 화면 너비에 맞게 압축 */
      .control-card { padding:10px; margin-bottom:14px; }
      .search-row { gap:6px; margin-bottom:9px; }
      .search-input { padding:9px 10px; font-size:.82rem; }
      .btn-clear { flex:0 0 auto; padding:8px 10px; font-size:.8rem; }
      .guild-check-row { gap:6px; padding:8px; margin-bottom:9px; flex-wrap:wrap; }
      .guild-check-label { font-size:.7rem; }
      .guild-member-select { flex:1 1 140px; padding:7px 6px; font-size:.7rem; }
      .guild-check-help { width:100%; font-size:.62rem; white-space:normal; }
      .tab-container { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
      .tab-btn { min-width:0; width:100%; padding:8px 2px; font-size:.76rem; white-space:nowrap; }

      /* 모바일 꽃 카드: 한 줄 3개 */
      .flower-grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
      .flower-card { border-radius:8px; }
      .flower-card:hover { transform:none; }
      .image-wrap { padding:6px 6px 7px; gap:5px; }
      .card-top-row { min-height:20px; gap:4px; }
      .grade-badge { min-width:30px; height:20px; padding:0 6px; border-radius:10px; font-size:.66rem; font-weight:800 !important; }
      .score-badge { min-height:20px; font-size:.6rem; }
      .grade-image-crop { border-radius:13px; }
      .card-body { padding:7px 5px 8px; }
      .flower-name { font-size:.72rem; line-height:1.25; margin-bottom:5px; min-height:1.8em; word-break:keep-all; }
      .btn-open { padding:6px 2px; font-size:.67rem; border-radius:5px; }
      .card-action-row { gap:3px; }
      .btn-own-check { padding:6px 1px; font-size:.61rem; border-radius:5px; }
      .result-info { font-size:.7rem; gap:6px; align-items:flex-start; }

      .flower-detail-layout { flex-direction:column; align-items:center; }
      .flower-detail-info { width:100%; }
    }
      .back-icon { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* 이미지 전용 뒤로가기 버튼 */
        .nav-btn-home {
            border: none !important;
            outline: none !important;
            background: transparent !important;
            box-shadow: none !important;
            padding: 0 !important;
            overflow: visible !important;
        }
        .nav-btn-home:hover {
            border: none !important;
            background: transparent !important;
            box-shadow: none !important;
            filter: brightness(.78);
        }
        .nav-btn-home:active { filter: brightness(.6); }
        .nav-btn-home .back-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border: 0;
        }

    /* demo_v28 N등급: 450×350 가로형 이미지 프레임 */
    .flower-card.grade-N .grade-image-crop {
      aspect-ratio:9 / 7;
      border-radius:8px;
      background:#f4ecd9;
    }
    .flower-card.grade-N .grade-image-crop .flower-image {
      width:100%;
      height:100%;
      object-fit:cover;
      transform:none;
    }
    .flower-detail-image.grade-N-detail {
      width:180px;
      height:auto;
      aspect-ratio:9 / 7;
      object-fit:cover;
      border-radius:8px;
    }
    @media (max-width:520px) {
      .flower-card.grade-N .grade-image-crop { border-radius:8px; }
      .flower-detail-image.grade-N-detail { width:min(180px, 100%); }
    }

    /* demo_v28 전체 등급: 가로형 꽃 이미지 프레임 */
    .grade-image-crop {
      aspect-ratio:9 / 7;
      border-radius:8px;
      background:#f4ecd9;
    }
    .grade-image-crop .flower-image {
      width:100%;
      height:100%;
      object-fit:cover;
      transform:none;
    }
    .flower-detail-image {
      width:180px;
      height:auto;
      aspect-ratio:9 / 7;
      object-fit:cover;
      border-radius:8px;
    }
    @media (max-width:520px) {
      .grade-image-crop { border-radius:8px; }
      .flower-detail-image { width:min(180px, 100%); }
    }
  </style>

    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#ffe680">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="레몬">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
  <div class="container-full">
    <div class="header">
      <div class="header-left">
        <a href="index.html" class="nav-btn-home" title="메인으로 돌아가기"><img src="images/ui/back-button.png" alt="뒤로가기" class="back-icon"></a>
        <div>
          <h1 style="margin:0; font-size:1.5rem;">🌷전체 꽃 도감🌷</h1>
          <p class="subtitle">더 코지 플로리스트의 모든 꽃을 사진으로 확인할 수 있습니다.</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="openAddFlowerModal" class="btn-add-flower" type="button">＋ 꽃 추가</button>
        <button id="openDeleteFlowerModal" class="btn-delete-flower" type="button" aria-label="등록 꽃 삭제" title="등록 꽃 삭제">🗑️</button>
      </div>
    </div>

    <div class="control-card">
      <div class="search-row">
        <input id="flowerSearch" class="search-input" type="search" placeholder="🔍 꽃 이름 검색..." autocomplete="off">
        <button id="clearSearch" class="btn-clear" type="button">초기화</button>
      </div>
      <div class="guild-check-row">
        <span class="guild-check-label">✅ 체크 대상 길드원</span>
        <select id="guildMemberSelect" class="guild-member-select" aria-label="체크 대상 길드원">
          <option value="">길드원을 선택해주세요</option>
        </select>
        <span id="guildCheckHelp" class="guild-check-help">선택 후 꽃 카드에서 바로 보유 체크할 수 있습니다.</span>
      </div>
      <div class="tab-container">
        <button class="tab-btn active" data-grade="ALL">전체 <span class="count">(69)</span></button>
        <button class="tab-btn" data-grade="N">N <span class="count">(69)</span></button>
        <button class="tab-btn" data-grade="R">R <span class="count">(0)</span></button>
        <button class="tab-btn" data-grade="SR">SR <span class="count">(0)</span></button>
        <button class="tab-btn" data-grade="SSR">SSR <span class="count">(0)</span></button>
        <button class="tab-btn" data-grade="UR">UR <span class="count">(0)</span></button>
      </div>
    </div>

    <div class="result-info">
      <span id="resultText">총 69개의 꽃</span>
      <span>※ D1의 공용 꽃 데이터를 기준으로 모든 길드원에게 동일하게 표시됩니다.</span>
    </div>

    <div id="flowerGrid" class="flower-grid"></div>
  </div>

  <div class="modal-overlay" id="flowerDetailModal" aria-hidden="true">
    <div class="flower-detail-card" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="modal-header">
        <div class="modal-title" id="detailTitle">🌹 꽃 정보</div>
        <button class="modal-close" type="button" id="closeModal" aria-label="닫기">✕</button>
      </div>
      <div class="flower-detail-layout">
        <img id="detailImage" src="" alt="" class="flower-detail-image">
        <div class="flower-detail-info">
          <div id="detailName" class="flower-detail-name"></div>
          <div class="flower-detail-row"><span class="flower-detail-label">등급</span><span id="detailGrade"></span></div>
          <div class="flower-detail-row"><span class="flower-detail-label">분류</span><span id="detailCategory"></span></div>
          <div class="flower-detail-row"><span class="flower-detail-label">길드전</span><span id="detailScore"></span></div>
          <div class="flower-detail-row"><span class="flower-detail-label">획득</span><span id="detailAcquire"></span></div>
          <div class="flower-detail-row"><span class="flower-detail-label">비고</span><span id="detailNote"></span></div>
          <div class="detail-actions"><button id="openEditFlowerModal" class="btn-edit-flower" type="button">수정</button></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="addFlowerModal" aria-hidden="true">
    <div class="add-flower-card" role="dialog" aria-modal="true" aria-labelledby="addFlowerTitle">
      <div class="modal-header">
        <div class="modal-title" id="addFlowerTitle">＋ 새 꽃 추가</div>
        <button class="modal-close" type="button" id="closeAddFlowerModal" aria-label="닫기">✕</button>
      </div>
      <form id="addFlowerForm" class="add-flower-form">
        <div class="add-form-grid">
          <label>등급<select id="addGrade" name="grade" required><option>N</option><option>R</option><option>SR</option><option>SSR</option><option>UR</option></select></label>
          <label>분류<input id="addCategory" name="category" type="text" maxlength="80" placeholder="예: 꽃시장 교환" required></label>
          <label class="span-2">꽃 이름<input id="addName" name="name" type="text" maxlength="120" required></label>
          <label>길드전 점수<input id="addGuildScore" name="guildScore" type="number" min="0" max="9999" inputmode="numeric" placeholder="예: 14"></label>
          <label>획득<input id="addAcquire" name="acquire" type="text" maxlength="200" placeholder="예: 꽃시장"></label>
          <label class="span-2">비고<textarea id="addNote" name="note" maxlength="500" rows="3" placeholder="비고 내용을 입력하세요."></textarea></label>
          <label class="span-2">이미지<input id="addImage" name="image" type="file" accept="image/png,image/jpeg,image/webp" required><span class="image-help">PNG/JPG도 등록 시 웹용 WebP로 자동 변환됩니다.</span></label>
        </div>
        <div id="addFlowerStatus" class="add-status" aria-live="polite"></div>
        <div class="add-form-actions"><button id="submitAddFlower" class="btn-submit-flower" type="submit">등록</button></div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="editFlowerModal" aria-hidden="true">
    <div class="add-flower-card" role="dialog" aria-modal="true" aria-labelledby="editFlowerTitle">
      <div class="modal-header">
        <div class="modal-title" id="editFlowerTitle">✏️ 꽃 정보 수정</div>
        <button class="modal-close" type="button" id="closeEditFlowerModal" aria-label="닫기">✕</button>
      </div>
      <form id="editFlowerForm" class="add-flower-form">
        <input id="editKey" name="key" type="hidden">
        <div class="add-form-grid">
          <label>등급<select id="editGrade" name="grade" required><option>N</option><option>R</option><option>SR</option><option>SSR</option><option>UR</option></select></label>
          <label>분류<input id="editCategory" name="category" type="text" maxlength="80" required></label>
          <label class="span-2">꽃 이름<input id="editName" name="name" type="text" maxlength="120" required></label>
          <label>길드전 점수<input id="editGuildScore" name="guildScore" type="number" min="0" max="9999" inputmode="numeric"></label>
          <label>획득<input id="editAcquire" name="acquire" type="text" maxlength="200"></label>
          <label class="span-2">비고<textarea id="editNote" name="note" maxlength="500" rows="3"></textarea></label>
          <label class="span-2">이미지<input id="editImage" name="image" type="file" accept="image/png,image/jpeg,image/webp"><span class="image-help">새 이미지를 선택한 경우에만 WebP로 변환하여 R2에 저장합니다.</span><span id="editCurrentImage" class="edit-current-image"></span></label>
        </div>
        <div id="editFlowerStatus" class="add-status" aria-live="polite"></div>
        <div class="add-form-actions"><button id="submitEditFlower" class="btn-submit-flower" type="submit">저장</button></div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="deleteFlowerModal" aria-hidden="true">
    <div class="delete-flower-card" role="dialog" aria-modal="true" aria-labelledby="deleteFlowerTitle">
      <div class="modal-header">
        <div class="modal-title" id="deleteFlowerTitle">🗑 꽃 삭제</div>
        <button class="modal-close" type="button" id="closeDeleteFlowerModal" aria-label="닫기">✕</button>
      </div>
      <p class="delete-guide">D1에 저장된 모든 꽃이 표시됩니다. 삭제하면 전체/길드 꽃 도감에서 함께 사라지며, R2에 저장된 해당 꽃 이미지는 함께 삭제됩니다.</p>
      <div id="deleteFlowerList" class="delete-flower-list"></div>
    </div>
  </div>

  <script src="flower-data-all.js"></script>
  <script>
    const masterFlowers = window.FLOWER_MASTER_DATA || [];
    const FLOWERS_API = '/api/flowers';
    const GUILD_STATE_API = '/api/guild-state';
    const BASE_SEED_VERSION = 'demo_v28_base_356';
    let remoteFlowers = [];
    let d1Ready = false;
    let activeGrade = 'ALL';
    let currentDetailKey = '';
    const requestedFlowerKey = new URLSearchParams(location.search).get('flower') || '';
    let requestedFlowerHandled = false;
    let guildMembers = JSON.parse(localStorage.getItem('guild_members') || '[]');
    let guildChecks = JSON.parse(localStorage.getItem('guild_checks') || '{}');
    let selectedGuildMemberId = localStorage.getItem('all_flower_selected_member') || '';
    let guildStateReady = false;
    let guildStateUpdatedAt = 0;
    let guildStateRequestInFlight = false;
    const guildRoleOrder = { '길드장':1, '부길드장':2, '임원':3, '정예':4, '멤버':5 };

    const grid = document.getElementById('flowerGrid');
    const searchInput = document.getElementById('flowerSearch');
    const resultText = document.getElementById('resultText');
    const modal = document.getElementById('flowerDetailModal');
    const addFlowerModal = document.getElementById('addFlowerModal');
    const editFlowerModal = document.getElementById('editFlowerModal');
    const deleteFlowerModal = document.getElementById('deleteFlowerModal');
    const deleteFlowerList = document.getElementById('deleteFlowerList');
    const addFlowerForm = document.getElementById('addFlowerForm');
    const editFlowerForm = document.getElementById('editFlowerForm');
    const addFlowerStatus = document.getElementById('addFlowerStatus');
    const editFlowerStatus = document.getElementById('editFlowerStatus');
    const guildMemberSelect = document.getElementById('guildMemberSelect');
    const guildCheckHelp = document.getElementById('guildCheckHelp');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
    }

    function getSortedGuildMembers() {
      return [...guildMembers].sort((a, b) => {
        const roleDiff = (guildRoleOrder[a.role] || 99) - (guildRoleOrder[b.role] || 99);
        if (roleDiff) return roleDiff;
        return String(a.name || '').localeCompare(String(b.name || ''), 'ko-KR');
      });
    }

    function getSelectedGuildMember() {
      return guildMembers.find(member => member.id === selectedGuildMemberId) || null;
    }

    function getGuildFlowerCheckKey(flowerKey, memberId) {
      return `flower::${encodeURIComponent(flowerKey)}::${memberId}`;
    }

    function isFlowerOwnedBySelectedMember(flower) {
      if (!selectedGuildMemberId || !flower?.key) return false;
      return Boolean(guildChecks[getGuildFlowerCheckKey(flower.key, selectedGuildMemberId)]);
    }

    function renderGuildMemberSelect() {
      const sorted = getSortedGuildMembers();
      const validIds = new Set(sorted.map(member => member.id));
      if (selectedGuildMemberId && !validIds.has(selectedGuildMemberId)) {
        selectedGuildMemberId = '';
        localStorage.removeItem('all_flower_selected_member');
      }
      guildMemberSelect.innerHTML = '<option value="">길드원을 선택해주세요</option>' + sorted.map(member =>
        `<option value="${escapeHtml(member.id)}">${escapeHtml(member.role || '멤버')} · ${escapeHtml(member.name || '')}</option>`
      ).join('');
      guildMemberSelect.value = selectedGuildMemberId;
      const selected = getSelectedGuildMember();
      guildCheckHelp.textContent = selected
        ? `${selected.name}님의 보유 현황을 카드에서 바로 체크합니다.`
        : '선택 후 꽃 카드에서 바로 보유 체크할 수 있습니다.';
    }

    function applyGuildState(state, updatedAt = 0) {
      if (!state || typeof state !== 'object') return false;
      let changed = false;
      if (Array.isArray(state.members)) {
        guildMembers = state.members;
        localStorage.setItem('guild_members', JSON.stringify(guildMembers));
        changed = true;
      }
      if (state.checks && typeof state.checks === 'object' && !Array.isArray(state.checks)) {
        guildChecks = state.checks;
        localStorage.setItem('guild_checks', JSON.stringify(guildChecks));
        changed = true;
      }
      guildStateUpdatedAt = Math.max(guildStateUpdatedAt, Number(updatedAt || 0));
      renderGuildMemberSelect();
      if (changed) renderFlowers();
      return changed;
    }

    async function fetchGuildState(force = false) {
      if (guildStateRequestInFlight) return;
      guildStateRequestInFlight = true;
      try {
        const response = await fetch(GUILD_STATE_API, { cache:'no-store' });
        if (!response.ok) throw new Error(`GET ${response.status}`);
        const payload = await response.json();
        const updatedAt = Number(payload.updatedAt || 0);
        if (payload.exists && payload.state && (force || updatedAt > guildStateUpdatedAt)) {
          applyGuildState(payload.state, updatedAt);
        } else {
          renderGuildMemberSelect();
        }
        guildStateReady = true;
      } catch (error) {
        console.warn('길드 체크 상태 불러오기 실패', error);
        renderGuildMemberSelect();
      } finally {
        guildStateRequestInFlight = false;
      }
    }

    async function toggleSelectedMemberFlower(flowerKey) {
      if (!selectedGuildMemberId) {
        alert('먼저 체크 대상 길드원을 선택해주세요.');
        guildMemberSelect.focus();
        return;
      }
      const flower = findFlowerByKey(flowerKey);
      if (!flower) return;
      const checkKey = getGuildFlowerCheckKey(flower.key, selectedGuildMemberId);
      const shouldCheck = !Boolean(guildChecks[checkKey]);
      if (shouldCheck) guildChecks[checkKey] = true;
      else delete guildChecks[checkKey];
      localStorage.setItem('guild_checks', JSON.stringify(guildChecks));
      renderFlowers();
      try {
        const response = await fetch(GUILD_STATE_API, {
          method:'PATCH',
          headers:{ 'Content-Type':'application/json' },
          body:JSON.stringify({ changes:[{ key:checkKey, checked:shouldCheck }] })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || `PATCH ${response.status}`);
        guildStateUpdatedAt = Number(payload.updatedAt || Date.now());
        guildStateReady = true;
      } catch (error) {
        console.warn('전체 꽃 도감 보유 체크 저장 실패', error);
        alert('체크 저장에 실패했습니다. 서버 상태를 다시 불러옵니다.');
        await fetchGuildState(true);
      }
    }

    function getAllFlowers() {
      return d1Ready ? remoteFlowers : masterFlowers;
    }

    function updateGradeCounts(flowers) {
      guildMemberSelect.addEventListener('change', () => {
      selectedGuildMemberId = guildMemberSelect.value;
      if (selectedGuildMemberId) localStorage.setItem('all_flower_selected_member', selectedGuildMemberId);
      else localStorage.removeItem('all_flower_selected_member');
      renderGuildMemberSelect();
      renderFlowers();
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
        const grade = btn.dataset.grade;
        const count = grade === 'ALL' ? flowers.length : flowers.filter(f => f.grade === grade).length;
        const countEl = btn.querySelector('.count');
        if (countEl) countEl.textContent = `(${count})`;
      });
    }

    function renderFlowers() {
      const flowers = getAllFlowers();
      const keyword = searchInput.value.trim().toLocaleLowerCase('ko-KR');
      const filtered = flowers.filter(f =>
        (activeGrade === 'ALL' || f.grade === activeGrade) &&
        (`${f.listName || ''} ${f.name || ''}`).toLocaleLowerCase('ko-KR').includes(keyword)
      );
      resultText.textContent = `총 ${filtered.length}개의 꽃`;
      updateGradeCounts(flowers);
      if (!filtered.length) {
        grid.innerHTML = '<div class="empty-result">조건에 맞는 꽃이 없습니다.</div>';
        return;
      }
      grid.innerHTML = filtered.map(f => `
        <article class="flower-card grade-${escapeHtml(f.grade)}">
          <div class="image-wrap">
            <div class="card-top-row">
              <span class="grade-badge">${escapeHtml(f.grade)}</span>
              <span class="score-badge">⚔️ ${f.guildScore == null ? '-' : `${escapeHtml(f.guildScore)}점`}</span>
            </div>
            <div class="grade-image-crop">
              <img src="${escapeHtml(f.image)}" alt="${escapeHtml(f.name)}" class="flower-image">
            </div>
          </div>
          <div class="card-body">
            <div class="flower-name">${escapeHtml(f.name)}</div>
            <div class="card-action-row">
              <button class="btn-own-check ${isFlowerOwnedBySelectedMember(f) ? 'checked' : ''}" type="button" data-key="${escapeHtml(f.key)}" ${selectedGuildMemberId ? '' : 'disabled'}>${isFlowerOwnedBySelectedMember(f) ? '✓ 보유' : '□ 보유'}</button>
              <button class="btn-open" type="button" data-key="${escapeHtml(f.key)}">열기</button>
            </div>
          </div>
        </article>`).join('');
      document.querySelectorAll('.btn-open').forEach(btn => btn.addEventListener('click', openDetail));
      document.querySelectorAll('.btn-own-check').forEach(btn => btn.addEventListener('click', () => toggleSelectedMemberFlower(btn.dataset.key)));
    }

    function findFlowerByKey(key) {
      return getAllFlowers().find(f => f.key === key);
    }

    function showDetailForKey(key) {
      const flower = findFlowerByKey(key);
      if (!flower) return;
      currentDetailKey = flower.key;
      const detailImage = document.getElementById('detailImage');
      detailImage.src = flower.image;
      detailImage.alt = flower.name;
      detailImage.style.opacity = '1';
      detailImage.onerror = function () { this.onerror = null; this.style.opacity = '.15'; };
      document.getElementById('detailName').textContent = flower.name;
      document.getElementById('detailGrade').textContent = flower.grade;
      document.getElementById('detailCategory').textContent = flower.category || '-';
      document.getElementById('detailScore').textContent = flower.guildScore == null ? '-' : `${flower.guildScore}점`;
      document.getElementById('detailAcquire').textContent = flower.acquire || '-';
      document.getElementById('detailNote').textContent = flower.note || '-';
      modal.classList.add('active');
      modal.setAttribute('aria-hidden','false');
    }

    function openDetail() {
      showDetailForKey(this.dataset.key);
    }

    function closeDetail() {
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden','true');
    }

    function openAddFlowers() {
      addFlowerStatus.textContent = '';
      addFlowerStatus.className = 'add-status';
      addFlowerModal.classList.add('active');
      addFlowerModal.setAttribute('aria-hidden','false');
      setTimeout(() => document.getElementById('addCategory').focus(), 0);
    }

    function closeAddFlowers() {
      addFlowerModal.classList.remove('active');
      addFlowerModal.setAttribute('aria-hidden','true');
    }

    function openEditFlowers(key = currentDetailKey) {
      const flower = findFlowerByKey(key);
      if (!flower || !d1Ready) return;
      document.getElementById('editKey').value = flower.key;
      document.getElementById('editGrade').value = flower.grade;
      document.getElementById('editCategory').value = flower.category || '';
      document.getElementById('editName').value = flower.name || '';
      document.getElementById('editGuildScore').value = flower.guildScore == null ? '' : flower.guildScore;
      document.getElementById('editAcquire').value = flower.acquire || '';
      document.getElementById('editNote').value = flower.note || '';
      document.getElementById('editImage').value = '';
      document.getElementById('editCurrentImage').textContent = `현재 이미지: ${flower.hasR2Image ? 'R2 이미지' : '프로젝트 기본 이미지'} · 변경하지 않으려면 선택하지 마세요.`;
      editFlowerStatus.textContent = '';
      editFlowerStatus.className = 'add-status';
      editFlowerModal.classList.add('active');
      editFlowerModal.setAttribute('aria-hidden','false');
      setTimeout(() => document.getElementById('editName').focus(), 0);
    }

    function closeEditFlowers() {
      editFlowerModal.classList.remove('active');
      editFlowerModal.setAttribute('aria-hidden','true');
    }

    function renderDeleteFlowerList() {
      if (!d1Ready || !remoteFlowers.length) {
        deleteFlowerList.innerHTML = '<div class="delete-empty">삭제할 꽃이 없습니다.</div>';
        return;
      }
      deleteFlowerList.innerHTML = remoteFlowers.map(f => `
        <div class="delete-flower-row">
          <div class="delete-flower-info">
            <span class="delete-grade">${escapeHtml(f.grade)}</span>
            <span class="delete-flower-name">${escapeHtml(f.listName)}</span>
          </div>
          <button class="btn-delete-row" type="button" data-key="${escapeHtml(f.key)}">삭제</button>
        </div>`).join('');
      deleteFlowerList.querySelectorAll('.btn-delete-row').forEach(btn => btn.addEventListener('click', () => deleteFlower(btn.dataset.key)));
    }

    function openDeleteFlowers() {
      renderDeleteFlowerList();
      deleteFlowerModal.classList.add('active');
      deleteFlowerModal.setAttribute('aria-hidden','false');
    }

    function closeDeleteFlowers() {
      deleteFlowerModal.classList.remove('active');
      deleteFlowerModal.setAttribute('aria-hidden','true');
    }

    async function ensureBaseSeed() {
      const response = await fetch(`${FLOWERS_API}?seed=1`, {
        method:'POST',
        headers:{ 'content-type':'application/json' },
        body:JSON.stringify({ seedVersion:BASE_SEED_VERSION, flowers:masterFlowers })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || `기본 꽃 D1 이전 실패 (${response.status})`);
      return payload;
    }

    async function fetchRemoteFlowers() {
      const response = await fetch(FLOWERS_API, { cache:'no-store' });
      if (!response.ok) throw new Error(`GET ${response.status}`);
      const payload = await response.json();
      return Array.isArray(payload.flowers) ? payload.flowers : [];
    }

    async function syncRemoteFlowers(silent = true) {
      try {
        remoteFlowers = await fetchRemoteFlowers();
        d1Ready = true;
        renderFlowers();
        openRequestedFlowerIfNeeded();
        if (deleteFlowerModal.classList.contains('active')) renderDeleteFlowerList();
      } catch (error) {
        console.warn('D1 꽃 데이터 불러오기 실패', error);
        if (!silent) alert('공용 꽃 데이터를 불러오지 못했습니다. Cloudflare D1 연결을 확인해주세요.');
      }
    }

    function openRequestedFlowerIfNeeded() {
      if (!requestedFlowerKey || requestedFlowerHandled || !d1Ready) return;
      requestedFlowerHandled = true;
      const flower = findFlowerByKey(requestedFlowerKey);
      if (flower) {
        activeGrade = flower.grade || 'ALL';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.grade === activeGrade));
        searchInput.value = '';
        renderFlowers();
        showDetailForKey(requestedFlowerKey);
        history.replaceState(null, '', 'page5.html');
        return;
      }
      alert('이 업데이트에 연결된 꽃은 현재 전체 꽃 도감에 없습니다. 삭제되었거나 더 이상 존재하지 않는 꽃일 수 있습니다.');
      history.replaceState(null, '', 'page5.html');
    }

    async function imageToWebP(file) {
      if (!file) throw new Error('이미지를 선택해주세요.');
      const imageUrl = URL.createObjectURL(file);
      try {
        const img = await new Promise((resolve, reject) => {
          const el = new Image();
          el.onload = () => resolve(el);
          el.onerror = () => reject(new Error('이미지 파일을 읽을 수 없습니다.'));
          el.src = imageUrl;
        });
        const maxWidth = 1600;
        const scale = Math.min(1, maxWidth / img.naturalWidth);
        const width = Math.max(1, Math.round(img.naturalWidth * scale));
        const height = Math.max(1, Math.round(img.naturalHeight * scale));
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/webp', .88));
        if (!blob) throw new Error('WebP 변환에 실패했습니다.');
        return new File([blob], 'flower.webp', { type:'image/webp' });
      } finally {
        URL.revokeObjectURL(imageUrl);
      }
    }

    addFlowerForm.addEventListener('submit', async e => {
      e.preventDefault();
      if (!d1Ready) {
        addFlowerStatus.textContent = 'D1 꽃 데이터를 먼저 불러와주세요.';
        addFlowerStatus.className = 'add-status error';
        return;
      }
      const submit = document.getElementById('submitAddFlower');
      const imageInput = document.getElementById('addImage');
      const grade = document.getElementById('addGrade').value;
      const category = document.getElementById('addCategory').value.trim();
      const name = document.getElementById('addName').value.trim();
      const listName = category ? `[${category}] ${name}` : name;
      if (getAllFlowers().some(f => f.grade === grade && f.listName === listName)) {
        addFlowerStatus.textContent = '같은 등급에 동일한 [분류] 꽃 이름이 이미 있습니다.';
        addFlowerStatus.className = 'add-status error';
        return;
      }
      submit.disabled = true;
      addFlowerStatus.textContent = '이미지를 WebP로 변환하고 등록 중입니다…';
      addFlowerStatus.className = 'add-status';
      try {
        const webp = await imageToWebP(imageInput.files[0]);
        const form = new FormData();
        form.append('grade', grade);
        form.append('category', category);
        form.append('name', name);
        form.append('guildScore', document.getElementById('addGuildScore').value.trim());
        form.append('acquire', document.getElementById('addAcquire').value.trim());
        form.append('note', document.getElementById('addNote').value.trim());
        form.append('image', webp, 'flower.webp');
        const response = await fetch(FLOWERS_API, { method:'POST', body:form });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || `등록 실패 (${response.status})`);
        addFlowerStatus.textContent = '등록되었습니다. 전체/길드 꽃 도감과 업데이트 내역에 자동 반영됩니다.';
        addFlowerStatus.className = 'add-status ok';
        addFlowerForm.reset();
        await syncRemoteFlowers(true);
        setTimeout(closeAddFlowers, 650);
      } catch (error) {
        addFlowerStatus.textContent = error.message || '등록 중 오류가 발생했습니다.';
        addFlowerStatus.className = 'add-status error';
      } finally {
        submit.disabled = false;
      }
    });

    editFlowerForm.addEventListener('submit', async e => {
      e.preventDefault();
      const submit = document.getElementById('submitEditFlower');
      const key = document.getElementById('editKey').value;
      const grade = document.getElementById('editGrade').value;
      const category = document.getElementById('editCategory').value.trim();
      const name = document.getElementById('editName').value.trim();
      const listName = category ? `[${category}] ${name}` : name;
      if (getAllFlowers().some(f => f.key !== key && f.grade === grade && f.listName === listName)) {
        editFlowerStatus.textContent = '같은 등급에 동일한 [분류] 꽃 이름이 이미 있습니다.';
        editFlowerStatus.className = 'add-status error';
        return;
      }

      submit.disabled = true;
      editFlowerStatus.textContent = '꽃 정보를 저장 중입니다…';
      editFlowerStatus.className = 'add-status';
      try {
        const form = new FormData();
        form.append('key', key);
        form.append('grade', grade);
        form.append('category', category);
        form.append('name', name);
        form.append('guildScore', document.getElementById('editGuildScore').value.trim());
        form.append('acquire', document.getElementById('editAcquire').value.trim());
        form.append('note', document.getElementById('editNote').value.trim());

        const imageFile = document.getElementById('editImage').files[0];
        if (imageFile) {
          editFlowerStatus.textContent = '새 이미지를 WebP로 변환하고 저장 중입니다…';
          const webp = await imageToWebP(imageFile);
          form.append('image', webp, 'flower.webp');
        }

        const response = await fetch(FLOWERS_API, { method:'PUT', body:form });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || `수정 실패 (${response.status})`);
        editFlowerStatus.textContent = '수정되었습니다. 전체/길드 꽃 도감과 업데이트 내역에 자동 반영됩니다.';
        editFlowerStatus.className = 'add-status ok';
        await syncRemoteFlowers(true);
        closeEditFlowers();
        showDetailForKey(key);
      } catch (error) {
        editFlowerStatus.textContent = error.message || '수정 중 오류가 발생했습니다.';
        editFlowerStatus.className = 'add-status error';
      } finally {
        submit.disabled = false;
      }
    });

    async function deleteFlower(key) {
      const flower = remoteFlowers.find(f => f.key === key);
      if (!flower) return;
      if (!confirm(`'${flower.listName}' 꽃을 삭제하시겠습니까?\n전체 꽃 도감과 길드 꽃 도감에서 함께 제거됩니다.\nR2에 저장된 이미지가 있다면 함께 삭제됩니다.`)) return;
      try {
        const response = await fetch(`${FLOWERS_API}?key=${encodeURIComponent(key)}`, { method:'DELETE' });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || `삭제 실패 (${response.status})`);
        if (currentDetailKey === key) closeDetail();
        await syncRemoteFlowers(true);
        renderDeleteFlowerList();
      } catch (error) {
        alert(error.message || '삭제 중 오류가 발생했습니다.');
      }
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeGrade = btn.dataset.grade;
        renderFlowers();
      });
    });
    searchInput.addEventListener('input', renderFlowers);
    document.getElementById('clearSearch').addEventListener('click', () => {
      searchInput.value=''; activeGrade='ALL';
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.grade==='ALL'));
      renderFlowers(); searchInput.focus();
    });
    document.getElementById('closeModal').addEventListener('click', closeDetail);
    modal.addEventListener('click', e => { if (e.target === modal) closeDetail(); });
    document.getElementById('openEditFlowerModal').addEventListener('click', () => openEditFlowers());
    document.getElementById('openAddFlowerModal').addEventListener('click', openAddFlowers);
    document.getElementById('closeAddFlowerModal').addEventListener('click', closeAddFlowers);
    addFlowerModal.addEventListener('click', e => { if (e.target === addFlowerModal) closeAddFlowers(); });
    document.getElementById('closeEditFlowerModal').addEventListener('click', closeEditFlowers);
    editFlowerModal.addEventListener('click', e => { if (e.target === editFlowerModal) closeEditFlowers(); });
    document.getElementById('openDeleteFlowerModal').addEventListener('click', openDeleteFlowers);
    document.getElementById('closeDeleteFlowerModal').addEventListener('click', closeDeleteFlowers);
    deleteFlowerModal.addEventListener('click', e => { if (e.target === deleteFlowerModal) closeDeleteFlowers(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeDetail(); closeAddFlowers(); closeEditFlowers(); closeDeleteFlowers(); }
    });

    async function initializeFlowers() {
      renderGuildMemberSelect();
      renderFlowers();
      await fetchGuildState(true);
      try {
        await ensureBaseSeed();
        await syncRemoteFlowers(false);
      } catch (error) {
        console.error('D1 기본 꽃 이전/조회 실패', error);
        alert(`D1 꽃 데이터 초기화에 실패했습니다.\n${error.message || error}\n기존 flower-data-all.js 데이터를 임시로 표시합니다.`);
      }
    }

    initializeFlowers();
    setInterval(() => syncRemoteFlowers(true), 5000);
    setInterval(() => fetchGuildState(false), 1000);
    window.addEventListener('focus', () => { syncRemoteFlowers(true); fetchGuildState(true); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { syncRemoteFlowers(true); fetchGuildState(true); } });
  </script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch((err) => console.warn('PWA service worker registration failed:', err));
    });
  }
</script>

</body>
</html>
